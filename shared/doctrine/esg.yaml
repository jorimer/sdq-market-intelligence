# House doctrine — Eje 7: ESG & clima (Índice de Resiliencia Climática)
# Doctrina §9: materialidad financiera > cumplimiento formal; ajustar a la
# vulnerabilidad del Caribe (huracanes/costa).
#
# RE-ENCUADRE 2026-06-18 (v2.0): el IRC pasa de POR-SECTOR a NACIONAL (país),
# con panel Caribe/LatAm — porque el dato climático real (ND-GAIN, CLIMADA/HURDAT2,
# balance energético) se mide nacionalmente, no por sector económico. Molde IRMP.
#
# IRC: 0-100, MAYOR = MAYOR resiliencia / MENOR riesgo climático.
version: "2.0"
name: IRC
direction: "mayor score = mayor resiliencia / menor riesgo climático"

dimension_weights:
  physical_risk: 0.30
  transition_risk: 0.25
  adaptive_capacity: 0.25
  governance: 0.20

dimension_variables:
  physical_risk:
    - hurricane_exposure     # exposición a huracanes (HURDAT2/NOAA) mayor = peor
    - climate_sensitivity    # sensibilidad climática (ND-GAIN)      mayor = peor
  transition_risk:
    - fossil_dependence      # dependencia de fósiles (energía/PEN) mayor = peor
    - carbon_intensity       # intensidad de carbono (CO2)          mayor = peor
  adaptive_capacity:
    - adaptation_readiness   # preparación para adaptarse (ND-GAIN readiness) mayor = mejor
    - economic_readiness     # preparación económica (ND-GAIN)                mayor = mejor
  governance:
    - governance_quality     # calidad de gobernanza (ND-GAIN)  mayor = mejor
    - social_readiness       # preparación social (ND-GAIN)     mayor = mejor

# Variables donde MAYOR valor = MAYOR riesgo → se invierten en el min-max.
risk_increasing:
  - hurricane_exposure
  - climate_sensitivity
  - fossil_dependence
  - carbon_intensity

bands:
  - {name: Alta,     lower: 60.0, color: "#047857"}   # alta resiliencia
  - {name: Moderada, lower: 40.0, color: "#F59E0B"}
  - {name: Baja,     lower: 0.0,  color: "#991B1B"}   # baja resiliencia / alto riesgo

# Rúbrica declarada (neutral) para lo aún no sourced. Transición (fossil/carbon)
# sube a real con el balance energético/PEN (Gate C) y un panel global (Ember).
# Físico afina con HURDAT2 (Gate B). Hoy: físico/adaptativa/gobernanza = ND-GAIN
# real; transición = rúbrica uniforme (no discrimina hasta tener la fuente).
rubric_defaults:
  fossil_dependence: 0.5
  carbon_intensity: 0.5

# Prosa CITABLE A CLIENTE, una por dimensión (Hallazgo 7). Lo ÚNICO que el retrieval indexa de
# este archivo; el resto (pesos, variables, bandas, rúbrica) lo lee el motor de scoring directo.
# REGLA (2026-07-22): el rationale declara SOLO LO DURABLE — qué mide y por qué pesa. La
# procedencia (real/rúbrica/brecha) la genera el registro en Metodología; gate de CI la veta aquí.
dimension_rationales:
  physical_risk: "Exposición física al riesgo climático: trayectorias de huracanes y sensibilidad climática general. Es la dimensión de mayor peso porque el Caribe enfrenta el riesgo físico climático más alto y menos discrecional del conjunto — no es una variable de política, es geografía."
  transition_risk: "Dependencia de combustibles fósiles e intensidad de carbono de la matriz energética — la exposición del país al costo de una transición energética global, no al clima físico en sí."
  adaptive_capacity: "Preparación física y económica del país para responder a impactos climáticos ya en curso. Compensa parcialmente el riesgo físico: dos países con igual exposición a huracanes no enfrentan el mismo riesgo neto si uno tiene mayor capacidad de respuesta."
  governance: "Calidad de gobernanza y preparación social para gestionar el riesgo climático. Pesa por debajo de las dimensiones físicas porque actúa como amplificador o amortiguador del riesgo, no como su origen."
