# House doctrine — Eje 3: Sectorial (IAI · Investment Attractiveness Index)
# Pesos BASE recalibrables por sector (la matriz por sector de spec v2 se
# superpone aquí cuando esté disponible). Fuente de verdad de pesos.
#
# IAI: 0-100, MAYOR = MAYOR ATRACTIVO de inversión.
version: "1.0"
name: IAI
direction: "mayor score = mayor atractivo"

# Pesos base del SPEC (deben sumar 1.0)
dimension_weights:
  macro: 0.25        # Entorno macroeconómico
  business: 0.25     # Clima de negocios
  talent: 0.20       # Talento / capital humano
  regulation: 0.15   # Calidad regulatoria
  sector: 0.15       # Dinámica propia del sector

dimension_variables:
  macro:
    - macro_exposure        # exposición macro POR-SECTOR (del contrato macro→sectorial,
                            # Eje 2): 50 ± impacto de los factores que golpean al sector.
                            # 0-100, mayor = mejor. Reemplaza gdp_growth/inflation_stability
                            # (económica-wide, no discriminaban entre sectores).
  business:
    - ease_of_business      # facilidad de hacer negocios 0-100 mayor = mejor   [rúbrica]
    - operating_cost        # costo operativo (índice)    mayor = peor          [TSS real]
    - profitability         # rentabilidad = utilidad/ingresos (ENAE)  mayor = mejor.
                            # Dato REAL per-sector. SIN rúbrica default: los sectores
                            # fuera del marco ENAE (≈9 de 17) la dejan AUSENTE y el motor
                            # la omite (no se falsea a 50 → cero distorsión min-max). Es la
                            # excepción honesta al "all-or-nothing" de operating_cost/labor.
  talent:
    - labor_availability    # disponibilidad de mano de obra 0-100 mayor = mejor
    - skills_index          # nivel de competencias 0-100 mayor = mejor
  regulation:
    - regulatory_quality    # calidad regulatoria 0-100   mayor = mejor  [WGI nacional]
    - regulatory_volatility # volatilidad regulatoria     mayor = peor   [WGI nacional:
                            # std de la serie de calidad regulatoria. Nacional/constante
                            # (no diferencia ranking; completa la procedencia real)]
  sector:
    - sector_growth         # crecimiento del sector (%)  mayor = mejor   [BCRD real]
    - sector_size           # tamaño relativo del sector  mayor = mejor   [BCRD real]

# Variables donde MAYOR valor = MENOR atractivo → se invierten.
risk_increasing:
  - operating_cost
  - regulatory_volatility

# Rúbrica declarada (Gate C) — juicio de casa para las dimensiones sin dato
# sectorial real aún (negocios / talento / regulatoria) + los inputs del SGPS
# (histórico / estructural). La UI las marca "rúbrica". Suben a real luego:
# regulatoria ← WGI (Eje 4); negocios/talento ← estudios de la ONE (pendiente).
#
# NEUTRAL 50 para los 17 ("no diferenciamos aún"). IMPORTANTE: bajo la
# normalización min-max del motor, dar overrides solo a ALGUNOS sectores hundiría
# a los neutrales al piso (un artefacto, no una señal). Por eso la rúbrica es
# uniforme: estas dimensiones quedan constantes (base transparente, no discriminan)
# y el ranking lo mueven solo `sector` (BCRD) y `macro_exposure` (contrato), que
# son dato real. La diferenciación por sector entra cuando haya dato real para
# TODOS (WGI / estudios ONE), no como juicio parcial que distorsiona.
rubric_defaults:
  ease_of_business: 50
  operating_cost: 50
  labor_availability: 50
  skills_index: 50
  regulatory_quality: 50
  regulatory_volatility: 50
  sgps_historical: 50
  sgps_structural: 50

# rubric_overrides: por-sector, vacío por ahora (ver nota arriba: parcial distorsiona).

# Bandas de atractivo (descendentes por 'lower', cobertura 0-100).
bands:
  - {name: Alto,  lower: 70.0, color: "#047857"}
  - {name: Medio, lower: 40.0, color: "#F59E0B"}
  - {name: Bajo,  lower: 0.0,  color: "#991B1B"}
