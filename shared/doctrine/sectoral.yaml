# House doctrine — Eje 3: Sectorial (IAI · Investment Attractiveness Index)
# Pesos BASE recalibrables por sector (la matriz por sector de spec v2 se
# superpone aquí cuando esté disponible). Fuente de verdad de pesos.
#
# IAI: 0-100, MAYOR = MAYOR ATRACTIVO de inversión.
version: "1.0"
name: IAI
direction: "mayor score = mayor atractivo"

# Pesos base del SPEC (deben sumar 1.0)
dimension_weights:
  macro: 0.25        # Entorno macroeconómico
  business: 0.25     # Clima de negocios
  talent: 0.20       # Talento / capital humano
  regulation: 0.15   # Calidad regulatoria
  sector: 0.15       # Dinámica propia del sector

dimension_variables:
  macro:
    - macro_exposure        # exposición macro POR-SECTOR (del contrato macro→sectorial,
                            # Eje 2): 50 ± impacto de los factores que golpean al sector.
                            # 0-100, mayor = mejor. Reemplaza gdp_growth/inflation_stability
                            # (económica-wide, no discriminaban entre sectores).
  business:
    - ease_of_business      # facilidad de hacer negocios 0-100 mayor = mejor   [rúbrica]
    - operating_cost        # costo operativo (índice)    mayor = peor          [TSS real]
    - profitability         # rentabilidad = utilidad/ingresos (ENAE)  mayor = mejor.
                            # Dato REAL per-sector. SIN rúbrica default: los sectores
                            # fuera del marco ENAE (≈9 de 17) la dejan AUSENTE y el motor
                            # la omite (no se falsea a 50 → cero distorsión min-max). Es la
                            # excepción honesta al "all-or-nothing" de operating_cost/labor.
    - credit_cost           # COSTO DEL CAPITAL: tasa promedio ponderada que el sistema
                            # financiero le cobra al sector (cubo `carteras/creditos` de la
                            # SIB, re-derivada del agregado por deuda — NUNCA promediando
                            # tasas). mayor = peor → va en `risk_increasing`. Es el hermano
                            # de `operating_cost`: uno es el precio del trabajo y el otro el
                            # precio del capital, y hasta ahora el índice solo miraba uno.
                            # SIN rúbrica default, como `profitability`: `comunicaciones` es
                            # el único slug que la SIB no cubre con ninguna letra CIIU y lo
                            # deja AUSENTE. Cobertura 16/17.
                            # POR QUÉ LA TASA Y NO LA MORA: se midieron las dos sobre el cubo
                            # y correlacionan a r=+0,65 — el precio del crédito ES, en buena
                            # parte, la lectura que el mercado hace del riesgo del sector, y
                            # meter las dos sería el mismo hecho votando dos veces. La tasa es
                            # además lo que un inversionista PAGA, no un desenlace realizado.
                            # La cobertura de provisiones se descartó por medición, no por
                            # gusto: energía marca 4.031% contra un rango de 124-483% del
                            # resto, y bajo el min-max crudo de este motor ese único valor
                            # comprimiría a los otros once contra el piso.
  talent:
    - labor_availability    # disponibilidad de mano de obra 0-100 mayor = mejor
    - skills_index          # nivel de competencias 0-100 mayor = mejor
  regulation:
    - regulatory_quality    # calidad regulatoria 0-100   mayor = mejor  [WGI nacional]
    - regulatory_volatility # volatilidad regulatoria     mayor = peor   [WGI nacional:
                            # std de la serie de calidad regulatoria. Nacional/constante
                            # (no diferencia ranking; completa la procedencia real)]
  sector:
    - sector_growth         # crecimiento del sector (%)  mayor = mejor   [BCRD real]
    - sector_size           # tamaño relativo del sector  mayor = mejor   [BCRD real]

# Variables donde MAYOR valor = MENOR atractivo → se invierten.
risk_increasing:
  - operating_cost
  - credit_cost
  - regulatory_volatility

# Alcance de la medición por variable (default: per_subject). "national" = dato real de
# alcance país, idéntico para los 17 sectores: sostiene el nivel del índice pero NO mueve
# el ranking. El generador de procedencia (shared/registry/provenance.py) lo declara al
# cliente para que "dato real" no se lea como "diferencia entre sectores".
variable_scopes:
  skills_index: national
  regulatory_quality: national
  regulatory_volatility: national

# Rúbrica declarada (Gate C) — juicio de casa para las dimensiones sin dato
# sectorial real aún (negocios / talento / regulatoria). La UI las marca "rúbrica".
# Suben a real luego: regulatoria ← WGI (Eje 4); negocios/talento ← estudios de la ONE.
#
# NEUTRAL 50 para los 17 ("no diferenciamos aún") en las dimensiones del IAI.
# IMPORTANTE: bajo la normalización min-max del motor del IAI, dar overrides solo a
# ALGUNOS sectores hundiría a los neutrales al piso (un artefacto, no una señal). Por
# eso la rúbrica del IAI es uniforme: estas dimensiones quedan constantes (base
# transparente, no discriminan) y el ranking lo mueven `sector` (BCRD) y
# `macro_exposure` (contrato), que son dato real. La diferenciación por sector entra
# cuando haya dato real para TODOS, no como juicio parcial que distorsiona.
#
# SGPS (histórico / estructural): estos NO pasan por min-max — el SGPS es una MEZCLA
# DIRECTA (suma ponderada por factor). Por eso ya se sirven con dato real por factor
# (histórico ← BCRD crecimiento, all-17; estructural ← margen ENAE, ~9/17 honesto) en
# escala absoluta, sin distorsión. Los defaults de abajo son solo el FALLBACK para el
# slug sin dato (p.ej. estructural de los 8 sectores fuera del marco ENAE): quedan en
# 50 y se rotulan rúbrica. Ver ``_load_sgps_historical`` / ``_load_sgps_structural``.
# Estado real (2026-07): de las 9 variables del IAI, 8 corren con dato real y solo
# ``ease_of_business`` sigue siendo rúbrica efectiva — el Doing Business del Banco Mundial se
# descontinuó y no hay fuente viva que lo reemplace. Los otros valores de abajo quedan como
# FALLBACK si su conector no devuelve dato en un período, no como el estado normal.
rubric_defaults:
  ease_of_business: 50   # ÚNICA rúbrica efectiva hoy (sin fuente viva)
  operating_cost: 50
  labor_availability: 50
  skills_index: 50
  regulatory_quality: 50
  regulatory_volatility: 50
  sgps_historical: 50    # fallback: slug sin serie de crecimiento (raro; BCRD cubre 17)
  sgps_structural: 50    # fallback: slug fuera del marco ENAE (~8/17)

# rubric_overrides: por-sector, vacío por ahora (ver nota arriba: parcial distorsiona).

# Bandas de atractivo (descendentes por 'lower', cobertura 0-100).
bands:
  - {name: Alto,  lower: 70.0, color: "#047857"}
  - {name: Medio, lower: 40.0, color: "#F59E0B"}
  - {name: Bajo,  lower: 0.0,  color: "#991B1B"}

# Prosa CITABLE A CLIENTE, una por dimensión (Hallazgo 7). Es lo ÚNICO de este archivo que el
# retrieval indexa; el resto (pesos, variables, bandas, rúbrica) lo lee el motor de scoring
# directo. Escrito para que un cliente lo lea — sin jerga de config ni identificadores de código.
#
# REGLA (definitiva, 2026-07-22): el rationale declara SOLO LO DURABLE — qué mide la dimensión
# y por qué pesa lo que pesa. NUNCA afirma procedencia ("es dato real", "es rúbrica", "la fuente
# X aún no existe"): ese estado cambia con cada conector y cada corrida, y la prosa que lo afirma
# envejece sola. La procedencia la GENERA el registro en la sección de Metodología
# (shared/registry/provenance.py), del mismo estado que gobierna el gate de honestidad. Un gate
# de CI (test_provenance_vocabulary_gate) hace cumplir esta separación.
dimension_rationales:
  macro: "Mide cómo las condiciones macroeconómicas del país golpean específicamente a este sector — no el macro genérico, sino su exposición particular (ver Doctrina · Contrato macro→sectorial). Es la dimensión de mayor peso porque ningún sector opera aislado del ciclo nacional."
  business: "Clima de negocios del sector: facilidad de operar, costo del trabajo, costo del capital y rentabilidad. El costo del capital es la tasa promedio ponderada a la que el sistema financiero le presta al sector, y entra junto al costo laboral porque las dos son el precio de los insumos con que un sector opera. La rentabilidad se toma de la Encuesta Nacional de Actividad Económica donde el sector está cubierto; donde no, la variable queda ausente en vez de rellenarse, para no distorsionar el índice con un valor inventado. Pesa igual que el entorno macro porque las condiciones operativas son el segundo determinante del atractivo después del ciclo."
  talent: "Disponibilidad de fuerza laboral y nivel de competencias relevantes para el sector — empleo por rama de actividad y capital humano. Pesa por debajo de macro y negocios porque el talento condiciona la ejecución a mediano plazo más que el resultado inmediato."
  regulation: "Calidad del marco regulatorio que enmarca al sector y su estabilidad en el tiempo. Pesa menos que las dimensiones operativas porque el marco regulatorio actúa sobre el sector de forma más indirecta que sus condiciones de operación."
  sector: "Crecimiento y tamaño relativo del sector dentro del valor agregado nacional. Junto con el entorno macro, es la dimensión que más diferencia a un sector de otro en el ranking, porque se mide por sector y no a nivel país."
