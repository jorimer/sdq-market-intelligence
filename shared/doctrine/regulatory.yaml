# House doctrine — Eje 4: Regulatorio & político (IRMP)
# Doctrina de Casa v1 §6. Fuente de verdad de pesos y bandas del índice.
# Todo cambio de ponderación se hace AQUÍ primero (PR), nunca en código.
#
# IRMP: 0-100, donde MAYOR = MENOR RIESGO (mayor estabilidad/predictibilidad).
version: "1.0"
name: IRMP
direction: "mayor score = menor riesgo"

# Pesos por dimensión (deben sumar 1.0)
dimension_weights:
  macro: 0.30        # Estabilidad macroeconómica
  external: 0.20     # Solidez externa
  political: 0.25    # Estabilidad político-institucional
  regulatory: 0.15   # Predictibilidad regulatoria
  events: 0.10       # Tensión / eventos de corto plazo

# Variables por dimensión (claves de entrada crudas)
dimension_variables:
  macro:
    - gdp_cagr_3y            # CAGR PIB 3a (%)              mayor = mejor
    - inflation_gap          # |inflación - meta| (pp)      mayor = peor
    - fiscal_balance_gdp     # balance fiscal / PIB (%)     mayor = mejor
    - public_debt_gdp        # deuda pública / PIB (%)      mayor = peor
    - reserves_import_months # reservas (meses import.)     mayor = mejor
  external:
    - current_account_gdp    # cuenta corriente / PIB (%)   mayor = mejor
    - fdi_gdp                # IED / PIB (%)                mayor = mejor
    - fx_volatility          # volatilidad cambiaria        mayor = peor
    - sovereign_rating_score # rating soberano 0-100        mayor = mejor
  political:
    - wgi_rule_of_law         # WGI percentil 0-100         mayor = mejor
    - wgi_gov_effectiveness   # WGI percentil 0-100         mayor = mejor
    - wgi_control_corruption  # WGI percentil 0-100         mayor = mejor
    - wgi_political_stability # WGI percentil 0-100         mayor = mejor
    - wgi_voice_accountability # WGI percentil 0-100        mayor = mejor
    - electoral_uncertainty   # 0-100 (rúbrica)             mayor = peor
    - policy_continuity       # 0-100 (rúbrica)             mayor = mejor
  regulatory:
    - wgi_regulatory_quality   # WGI percentil 0-100        mayor = mejor
    - regulatory_volatility_5y # cambios en 5a              mayor = peor
    - discretion               # 0-100 (rúbrica)            mayor = peor
    - contract_enforcement     # 0-100                      mayor = mejor
  events:
    - news_sentiment    # sentimiento noticias (-100..100) mayor = mejor
    - unrest_shocks     # intensidad disturbios 0-100      mayor = peor
    - sanctions_signal  # exposición a sanciones 0-100     mayor = peor

# Variables donde un valor crudo MAYOR implica MÁS riesgo → se invierten.
risk_increasing:
  - inflation_gap
  - public_debt_gdp
  - fx_volatility
  - electoral_uncertainty
  - regulatory_volatility_5y
  - discretion
  - unrest_shocks
  - sanctions_signal

# Bandas (descendentes por 'lower', cobertura completa de 0-100).
bands:
  - {name: Bajo,     lower: 80.0, color: "#047857"}
  - {name: Moderado, lower: 60.0, color: "#F59E0B"}
  - {name: Elevado,  lower: 40.0, color: "#F97316"}
  - {name: Alto,     lower: 0.0,  color: "#991B1B"}

# SUPUESTO declarado (no es un dato de API): meta de inflación por país, punto
# medio del rango meta oficial del banco central. Alimenta inflation_gap =
# |inflación observada − meta|. Cambiar aquí (PR) si una meta oficial cambia.
# PA es dolarizado (sin meta propia) → se usa la meta de facto importada (~2%).
inflation_targets:
  DO: 4.0   # BCRD: 4% ±1
  CR: 3.0   # BCCR: 3% ±1
  GT: 4.0   # Banguat: 4% ±1
  JM: 5.0   # BOJ: rango 4-6, punto medio
  PA: 2.0   # dolarizado: meta de facto importada (Fed largo plazo)

# SUPUESTO declarado (no hay API gratuita de ratings): rating soberano S&P de
# largo plazo en moneda extranjera, con su fecha. Verificado vía countryeconomy.com
# (dic-2025). Alimenta sovereign_rating_score = rating_scale[rating]. Actualizar
# por PR cuando una agencia cambie el rating.
sovereign_ratings:
  DO: {rating: "BB",   agency: "S&P", as_of: "2022-12-19"}
  CR: {rating: "BB",   agency: "S&P", as_of: "2025-10-22"}
  PA: {rating: "BBB-", agency: "S&P", as_of: "2024-11-26"}
  GT: {rating: "BB+",  agency: "S&P", as_of: "2025-05-23"}
  JM: {rating: "BB",   agency: "S&P", as_of: "2025-12-18"}

# RÚBRICA declarada (no hay API): las variables de juicio del IRMP aún no sourced
# en vivo, con su valor 0-100 por país. Fuente única para backend (snapshot) y
# frontend, de modo que el índice persistido coincida con el mostrado. Ajustable
# por PR. NOTA: news_sentiment/unrest_shocks/sanctions_signal se reemplazarán por
# dato real (GDELT) en T8 — al persistirse, el ensamblado los sobreescribe.
rubric_inputs:
  DO: {electoral_uncertainty: 30, policy_continuity: 65, regulatory_volatility_5y: 25, discretion: 35, contract_enforcement: 55, news_sentiment: 15, unrest_shocks: 20, sanctions_signal: 5}
  CR: {electoral_uncertainty: 22, policy_continuity: 70, regulatory_volatility_5y: 18, discretion: 28, contract_enforcement: 64, news_sentiment: 18, unrest_shocks: 16, sanctions_signal: 3}
  PA: {electoral_uncertainty: 28, policy_continuity: 60, regulatory_volatility_5y: 22, discretion: 40, contract_enforcement: 58, news_sentiment: 8, unrest_shocks: 24, sanctions_signal: 12}
  GT: {electoral_uncertainty: 45, policy_continuity: 45, regulatory_volatility_5y: 35, discretion: 55, contract_enforcement: 40, news_sentiment: -10, unrest_shocks: 38, sanctions_signal: 8}
  JM: {electoral_uncertainty: 25, policy_continuity: 68, regulatory_volatility_5y: 20, discretion: 32, contract_enforcement: 52, news_sentiment: 12, unrest_shocks: 28, sanctions_signal: 4}

# Escala S&P (notch → 0-100, lineal por escalón). Mayor = mejor calidad crediticia.
rating_scale:
  AAA: 100
  "AA+": 95
  "AA": 90
  "AA-": 85
  "A+": 80
  "A": 75
  "A-": 70
  "BBB+": 65
  "BBB": 60
  "BBB-": 55
  "BB+": 50
  "BB": 45
  "BB-": 40
  "B+": 35
  "B": 30
  "B-": 25
  "CCC+": 20
  "CCC": 15
  "CCC-": 10
  "CC": 5
  "SD": 0
  "D": 0
