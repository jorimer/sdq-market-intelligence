# House doctrine — Eje 4: Regulatorio & político (IRMP)
# Doctrina de Casa v1 §6. Fuente de verdad de pesos y bandas del índice.
# Todo cambio de ponderación se hace AQUÍ primero (PR), nunca en código.
#
# IRMP: 0-100, donde MAYOR = MENOR RIESGO (mayor estabilidad/predictibilidad).
version: "1.0"
name: IRMP
direction: "mayor score = menor riesgo"

# Pesos por dimensión (deben sumar 1.0)
dimension_weights:
  macro: 0.30        # Estabilidad macroeconómica
  external: 0.20     # Solidez externa
  political: 0.25    # Estabilidad político-institucional
  regulatory: 0.15   # Predictibilidad regulatoria
  events: 0.10       # Tensión / eventos de corto plazo

# Variables por dimensión (claves de entrada crudas)
dimension_variables:
  macro:
    - gdp_cagr_3y            # CAGR PIB 3a (%)              mayor = mejor
    - inflation_gap          # |inflación - meta| (pp)      mayor = peor
    - fiscal_balance_gdp     # balance fiscal / PIB (%)     mayor = mejor
    - public_debt_gdp        # deuda pública / PIB (%)      mayor = peor
    - reserves_import_months # reservas (meses import.)     mayor = mejor
  external:
    - current_account_gdp    # cuenta corriente / PIB (%)   mayor = mejor
    - fdi_gdp                # IED / PIB (%)                mayor = mejor
    - fx_volatility          # volatilidad cambiaria        mayor = peor
    - sovereign_rating_score # rating soberano 0-100        mayor = mejor
  political:
    - wgi_rule_of_law         # WGI absoluto 0-100          mayor = mejor
    - wgi_gov_effectiveness   # WGI absoluto 0-100          mayor = mejor
    - wgi_control_corruption  # WGI absoluto 0-100          mayor = mejor
    - wgi_political_stability # WGI absoluto 0-100          mayor = mejor
    - wgi_voice_accountability # WGI absoluto 0-100         mayor = mejor
    - electoral_uncertainty   # proximidad electoral (real) mayor = peor
  regulatory:
    - wgi_regulatory_quality   # WGI absoluto 0-100         mayor = mejor
    - regulatory_volatility_5y # std serie WGI (real)       mayor = peor
# Racionalización (2026-07): se RETIRARON del índice las rúbricas tecleadas
# `policy_continuity`, `discretion` y `contract_enforcement`. Eran juicio de casa y,
# además, DOBLE CONTEO de gobernanza que las dimensiones WGI ya capturan con dato real:
#   • contract_enforcement ⊂ wgi_rule_of_law (estado de derecho / cumplimiento)
#   • discretion ⊂ wgi_control_corruption + wgi_regulatory_quality
#   • policy_continuity ⊂ wgi_gov_effectiveness + wgi_political_stability
# Quitarlas elimina la última rúbrica dura del IRMP sin perder señal (la mide WGI).
  events:
    - news_sentiment    # sentimiento noticias (-100..100) mayor = mejor
    - unrest_shocks     # intensidad disturbios 0-100      mayor = peor
    - sanctions_signal  # exposición a sanciones 0-100     mayor = peor

# Variables donde un valor crudo MAYOR implica MÁS riesgo → se invierten.
risk_increasing:
  - inflation_gap
  - public_debt_gdp
  - fx_volatility
  - electoral_uncertainty
  - regulatory_volatility_5y
  - unrest_shocks
  - sanctions_signal

# Bandas (descendentes por 'lower', cobertura completa de 0-100).
bands:
  - {name: Bajo,     lower: 80.0, color: "#047857"}
  - {name: Moderado, lower: 60.0, color: "#F59E0B"}
  - {name: Elevado,  lower: 40.0, color: "#F97316"}
  - {name: Alto,     lower: 0.0,  color: "#991B1B"}

# SUPUESTO declarado (no es un dato de API): meta de inflación por país, punto
# medio del rango meta oficial del banco central. Alimenta inflation_gap =
# |inflación observada − meta|. Cambiar aquí (PR) si una meta oficial cambia.
# PA es dolarizado (sin meta propia) → se usa la meta de facto importada (~2%).
inflation_targets:
  DO: 4.0   # BCRD: 4% ±1
  CR: 3.0   # BCCR: 3% ±1
  GT: 4.0   # Banguat: 4% ±1
  JM: 5.0   # BOJ: rango 4-6, punto medio
  PA: 2.0   # dolarizado: meta de facto importada (Fed largo plazo)

# PISO declarado del rating soberano S&P de largo plazo en moneda extranjera, con su
# fecha de última ACCIÓN. Desde la automatización (2026-07), la fuente VIVA es el store
# refrescable `sovereign_ratings` (AppSetting) que la operación `sovereign-ratings-sync`
# actualiza desde Wikipedia (S&P/Fitch/Moody's); este bloque es solo el FALLBACK cuando el
# store aún no existe (deploy fresco/offline). Política de combinación: "S&P manda" — solo
# el ancla S&P alimenta sovereign_rating_score = rating_scale[rating]; Fitch/Moody's son
# contexto. Ver shared/contracts/sovereign_ratings.py. Editar por PR sigue siendo válido.
sovereign_ratings:
  DO: {rating: "BB",   agency: "S&P", as_of: "2022-12-19"}
  CR: {rating: "BB",   agency: "S&P", as_of: "2025-10-22"}
  PA: {rating: "BBB-", agency: "S&P", as_of: "2024-11-26"}
  GT: {rating: "BB+",  agency: "S&P", as_of: "2025-05-23"}
  JM: {rating: "BB",   agency: "S&P", as_of: "2025-12-18"}

# RÚBRICA declarada (fallback): valor 0-100 por país que el ensamblado usa SOLO
# cuando no hay dato real persistido para esa variable. El overlay live→rubric hace
# que, al sincronizarse la fuente, el dato real gane. Ya NO son rúbrica en vivo:
#   • news_sentiment / unrest_shocks / sanctions_signal ← GDELT (gdelt-bq-sync)
#   • regulatory_volatility_5y ← std de la serie WGI de calidad regulatoria
#     (derivado en wgi-2025-load; señal de inestabilidad, distinta del nivel).
#   • electoral_uncertainty ← proximidad a la próxima elección general (calculada en el
#     ensamblado desde `election_calendar`; riesgo de calendario, dato factual).
# YA NO HAY RÚBRICA DURA en el IRMP: policy_continuity/discretion/contract_enforcement se
# RETIRARON del índice (doble conteo de WGI, ver dimension_variables). Los valores de abajo
# son solo FALLBACK declarado para un deploy fresco (antes de que corran gdelt/wgi loads);
# en operación normal cada variable es dato real. `electoral_uncertainty` se computa en el
# ensamblado, así que su valor aquí es un piso conservador si el cálculo no aplicara.
rubric_inputs:
  DO: {electoral_uncertainty: 30, regulatory_volatility_5y: 25, news_sentiment: 15, unrest_shocks: 20, sanctions_signal: 5}
  CR: {electoral_uncertainty: 22, regulatory_volatility_5y: 18, news_sentiment: 18, unrest_shocks: 16, sanctions_signal: 3}
  PA: {electoral_uncertainty: 28, regulatory_volatility_5y: 22, news_sentiment: 8, unrest_shocks: 24, sanctions_signal: 12}
  GT: {electoral_uncertainty: 45, regulatory_volatility_5y: 35, news_sentiment: -10, unrest_shocks: 38, sanctions_signal: 8}
  JM: {electoral_uncertainty: 25, regulatory_volatility_5y: 20, news_sentiment: 12, unrest_shocks: 28, sanctions_signal: 4}

# CALENDARIO ELECTORAL (dato factual, mantenido): por país, la fecha ``anchor`` de una
# elección general REAL (YYYY-MM) + la duración constitucional del período (``term_years``).
# El ensamblado calcula la PRÓXIMA elección general on/after el período del snapshot
# (rodando el ancla por el ciclo) y de la PROXIMIDAD deriva ``electoral_uncertainty`` —
# dato real (fechas verificables + fórmula transparente), NO la rúbrica 0-100 tecleada.
# Es una señal de RIESGO DE CALENDARIO (evento electoral en el horizonte → incertidumbre de
# política/transición), distinta de la calidad institucional (que ya la capturan las dims
# WGI). Fuentes: autoridad electoral de cada país + Transparencia Electoral (calendario
# regional). Actualizar el ancla por PR cuando cambie el ciclo (o se confirme una fecha).
election_calendar:
  DO: {anchor: "2024-05", term_years: 4, source: "JCE (general 19-may-2024)"}
  CR: {anchor: "2022-02", term_years: 4, source: "TSE-CR / Transparencia Electoral (feb-2026)"}
  PA: {anchor: "2024-05", term_years: 5, source: "Tribunal Electoral PA (5-may-2024; próxima 6-may-2029)"}
  GT: {anchor: "2023-06", term_years: 4, source: "TSE-GT (próxima 27-jun-2027)"}
  JM: {anchor: "2020-09", term_years: 5, source: "ECJ (general 3-sep-2025; ciclo máx 5a, convoca el PM)"}

# Escala S&P (notch → 0-100, lineal por escalón). Mayor = mejor calidad crediticia.
rating_scale:
  AAA: 100
  "AA+": 95
  "AA": 90
  "AA-": 85
  "A+": 80
  "A": 75
  "A-": 70
  "BBB+": 65
  "BBB": 60
  "BBB-": 55
  "BB+": 50
  "BB": 45
  "BB-": 40
  "B+": 35
  "B": 30
  "B-": 25
  "CCC+": 20
  "CCC": 15
  "CCC-": 10
  "CC": 5
  "SD": 0
  "D": 0

# Prosa CITABLE A CLIENTE, una por dimensión (Hallazgo 7). Lo ÚNICO que el retrieval indexa de
# este archivo; el resto (pesos, variables, bandas, targets, ratings, calendario) lo lee el
# motor de scoring directo.
# REGLA (2026-07-22): el rationale declara SOLO LO DURABLE — qué mide y por qué pesa. La
# procedencia (real/rúbrica/brecha) la genera el registro en Metodología; gate de CI la veta aquí.
dimension_rationales:
  macro: "Estabilidad macroeconómica: crecimiento, brecha de inflación frente a la meta del banco central, balance fiscal, deuda pública y cobertura de reservas en meses de importación. Es la dimensión de mayor peso del IRMP porque la estabilidad macro condiciona directamente el costo de financiamiento soberano."
  external: "Solidez de la posición externa: cuenta corriente, inversión extranjera directa, volatilidad cambiaria y calificación soberana (S&P, con Fitch y Moody's como contexto — una sola agencia manda para evitar doble conteo)."
  political: "Estabilidad político-institucional, medida con los cinco indicadores absolutos de gobernanza mundial (estado de derecho, efectividad de gobierno, control de corrupción, estabilidad política, voz y rendición de cuentas) más la proximidad al próximo ciclo electoral según el calendario verificado de cada país. Es la dimensión con más peso individual después de macro porque la inestabilidad institucional es, históricamente, el mejor predictor de deterioro fiscal no forzado por choques externos."
  regulatory: "Calidad regulatoria y su estabilidad histórica. Pesa menos que las otras dimensiones institucionales porque se solapa parcialmente con la dimensión política — el índice retiró en 2026 las variables de continuidad de política, discrecionalidad y cumplimiento de contratos precisamente por ese doble conteo."
  events: "Tensión de corto plazo: tono de la cobertura noticiosa, intensidad de disturbios y exposición a sanciones. Es la dimensión de menor peso porque captura choques transitorios, no la condición estructural del país — pero es la que más rápido reacciona a un evento nuevo."
