# REGISTRO DE CAMBIOS DE METODOLOGÍA — control document, no notas de release.
#
# Para qué sirve. Cuando la vara cambia, las entidades se mueven sin haber hecho nada. El
# histórico ya marca esos movimientos con `RatingAction.metodologica`, pero esa marca dice
# QUE fue metodológico y no CUÁL cambio ni POR QUÉ. Este archivo le da el significado, y es
# lo que permite responderle a un cliente por qué su cifra cambió entre dos informes.
#
# Reglas de escritura (las verifica `shared/doctrine/tests/test_changelog.py`):
#
#  1. `que_cambio` describe la REGLA, no el resultado. El resultado se mide.
#  2. Toda cifra de impacto va bajo `impacto.medido_al_publicar` y se lee como lo que
#     afirmamos EN ESA FECHA — nunca como el estado actual. Una cifra de panel escrita en
#     prosa se vuelve mentira en la siguiente recalibración.
#  3. `pr` es obligatorio: el cambio tiene que ser auditable contra el código. Admite un
#     entero o una lista — un cambio puede entrar repartido en varios PRs, y el registro
#     tiene que poder decirlo en vez de elegir uno y perder el rastro del otro.
#  4. Una entrada NO se edita después de publicada. Si estaba mal, se agrega otra que la
#     corrija y se enlaza con `corrige`.
#
# `sectores` usa las claves de producto (banking, insurance, pension), no nombres de módulo.

version: "1.0"

cambios:
  - id: 2026-08-05-perfil-sdq
    fecha_efectiva: "2026-08-05"
    sectores: [banking, insurance, pension]
    titulo: "Perfil SDQ reemplaza la notación de letras"
    que_cambio: >-
      La calificación deja de expresarse como un símbolo único (SDQ-AAA…SDQ-D) y pasa a dos
      ejes independientes de 0-100: Ejecución (desempeño) y Resiliencia (exposición). Un
      símbolo único obligaba a promediar dos cosas que se mueven en sentidos opuestos.
    por_que: >-
      Una entidad puede mejorar su desempeño y deteriorar su exposición en el mismo período;
      la notación anterior no podía expresarlo y el promedio escondía la señal.
    impacto:
      medido_al_publicar: >-
        35.601 acciones de rating re-etiquetadas retroactivamente sobre 22 períodos; la
        notación se retiró de la API y de cinco pantallas.
    pr: 687

  - id: 2026-08-10-base-devengada-incurrida
    fecha_efectiva: "2026-08-10"
    sectores: [insurance]
    titulo: "El combined ratio pasa a base devengada/incurrida"
    que_cambio: >-
      Prima devengada en el denominador e siniestro incurrido en el numerador, en vez de
      prima suscrita y siniestro pagado. El catálogo SIS constituye la reserva en la sección
      5 y la libera en la 4, así que ambas magnitudes siempre fueron computables. Se
      incorporan además `5102 otras prestaciones` y se netan los `4309 salvamentos`, y el
      promedio del ciclo pasa a ponderarse por exposición.
    por_que: >-
      Revisión actuarial externa: numerador y denominador estaban en bases distintas, y la
      base pagada es gameable — demorar el reconocimiento mejora el ratio sin que mejore nada.
    impacto:
      medido_al_publicar: >-
        Mediana del panel de 88,4% a 95,9%; cinco compañías cambian de banda; el panel con
        Ejecución pasa de 25 a 32 aseguradoras.
    pr: 672

  - id: 2026-08-11-combined-no-interpretable
    fecha_efectiva: "2026-08-11"
    sectores: [insurance]
    titulo: "El combined ratio no se publica donde no mide desempeño"
    que_cambio: >-
      Ejecución se declara ausente, con el motivo en texto, cuando la compañía cede más del
      70% de su prima devengada (el ratio bruto describe un riesgo que no está en su balance)
      o cuando su producto de inversiones supera el 60% de la prima (el siniestro lo paga la
      reserva y su rendimiento, no la prima del ejercicio). La misma regla se aplica a las
      dimensiones de siniestralidad y resultado técnico del ISF.
    por_que: >-
      El combined ratio contradecía el estado de resultados y la trayectoria de patrimonio de
      tres compañías: afirmaba pérdidas de suscripción grandes en entidades con utilidad
      positiva y patrimonio creciendo. Abriendo el libro auditado resultaron ser una fronting
      y una compañía de anualidades, negocios donde el ancla de breakeven no aplica.
    impacto:
      medido_al_publicar: >-
        Tres aseguradoras dejan de publicar Ejecución y cuatro pierden la banda del ISF
        conservando su score, que sube al retirarse las dimensiones distorsionadas.
    pr: 688

  - id: 2026-08-12-solo-se-ordena-lo-comparable
    fecha_efectiva: "2026-08-12"
    sectores: [insurance, pension]
    titulo: "El ranking solo ordena entidades de cobertura completa"
    que_cambio: >-
      La posición relativa se computa entre las entidades con todas las dimensiones medidas.
      Las de cobertura parcial salen del orden y se publican aparte, con su cobertura y las
      dimensiones que les faltan. El promedio del panel también pasa a computarse solo sobre
      las comparables.
    por_que: >-
      Un score armado sobre tres de cinco dimensiones no mide lo mismo que uno de cinco, y
      ordenarlos juntos producía una posición que el lector no podía interpretar.
    impacto:
      medido_al_publicar: >-
        En seguros el universo comparable queda en 27 de 35; las posiciones publicadas se
        desplazan en consecuencia.
    pr: 689

  - id: 2026-08-12-suprimir-no-premia
    fecha_efectiva: "2026-08-12"
    sectores: [insurance]
    titulo: "Suprimir una dimensión deja de mejorar el score"
    que_cambio: >-
      Cuando la métrica no es interpretable para una compañía, el ISF tampoco publica su score
      global: antes retenía la banda pero renormalizaba el score sobre las dimensiones que
      quedaban. Se publican las dimensiones medibles una por una, con el motivo. Un dato
      ausente por falta de dato sigue renormalizando: la regla distingue las dos cosas. Se
      publica además el peso del último ejercicio en el promedio del ciclo, y los dos umbrales
      se declaran acotados por los datos y no determinados por ellos.
    por_que: >-
      Renormalizar equivale a suponer que las dimensiones suprimidas valen el promedio de las
      demás. Para un dato ausente esa suposición es neutra; para una métrica que no aplica no
      tiene con qué sostenerse, y producía un incentivo perverso — a una fronting le iba mejor
      precisamente por no poder medirla. Observación de la revisión actuarial externa.
    impacto:
      medido_al_publicar: >-
        Cuatro de 33 aseguradoras dejan de tener score ISF; las 29 restantes lo conservan. El
        peso del último ejercicio en el promedio del ciclo va de 27% en la mediana a 58% en el
        libro de mayor crecimiento.
    pr: [701, 702]

  - id: 2026-08-19-validacion-por-insumo
    fecha_efectiva: "2026-08-19"
    sectores: [banking, insurance, pension, macro, trade, esg, social_dev, agribusiness]
    titulo: "La cifra de validación se invalida por su insumo, no por el reloj"
    que_cambio: >-
      Todo reporte de validación guarda ahora la huella del insumo que lo produjo y se compara
      con la vigente al leerlo: si el dato o el score cambiaron después del cálculo, la
      respuesta lo declara obsoleto en vez de servir la cifra como verdad. Además, cada motor
      se recalcula por cascada cuando termina la operación que produce su insumo, y ninguna
      cifra marcada obsoleta —ni una cuya frescura sea indeterminada— puede entrar a material
      comercial.
    por_que: >-
      El reporte era un artefacto persistido que solo se recalculaba por cadencia fija. Una
      recalibración del score dejaba la cifra publicada huérfana de su insumo sin que nada lo
      señalara, y la plataforma sirvió durante semanas un índice de discriminación calculado
      con un score que ya no existía, mientras el material de venta citaba el correcto.
    impacto:
      medido_al_publicar: >-
        El índice de discriminación del rating bancario publicado pasó de 0,4436 a 0,1615
        sobre el mismo panel de 1.693 observaciones y 301 eventos. Los ocho reportes de
        validación del catálogo quedaron sellados y verificados vigentes el 2026-08-19.
    pr: [806, 808]

  - id: 2026-08-19-desenlace-de-banca-separado
    fecha_efectiva: "2026-08-19"
    sectores: [banking]
    titulo: "El backtest de banca deja de publicar un solo número para tres fenómenos"
    que_cambio: >-
      El desenlace que el backtest llama distress financiero es la unión de tres reglas
      —pérdidas sostenidas, deterioro de crédito y solvencia bajo el mínimo— y pasa a
      reportarse por familia, cada una con su propio N, su intervalo y su curva por banda. Se
      distinguen cuatro estados: concluyente, invertido (el score ordena al revés, que es un
      hallazgo y no una ausencia de señal), no concluyente y no evaluable (la regla nunca
      disparó). La curva por banda deja de presentarse como ordenamiento de riesgo mientras no
      lo sea, y el caveat nombra la banda que rompe la monotonía con su tamaño de muestra.
    por_que: >-
      Un solo índice contra la unión hacía que cada lector lo atribuyera al fenómeno que tenía
      en la cabeza, y el que domina el conteo no es el que se supone. En material de venta se
      leía como discriminación de riesgo de crédito, que es justamente donde el score falla.
    impacto:
      medido_al_publicar: >-
        De los 301 eventos del desenlace, 250 los aporta la regla de resultados, 66 la de
        crédito y ninguno la de solvencia. Contra la regla de crédito el Gini es −0,1437 con
        intervalo [−0,235 · −0,050].
    pr: [810, 811]

  - id: 2026-08-19-panel-auditado-desde-2013
    fecha_efectiva: "2026-08-19"
    sectores: [insurance]
    titulo: "El panel de estados auditados arranca en 2013 y no en 2018"
    que_cambio: >-
      La ingesta del histórico de estados financieros auditados pasa a arrancar en el primer
      año que la Superintendencia publica, comprobado contra el portal, en vez de en el año
      que suponía el conector.
    por_que: >-
      El arranque anterior era una suposición sobre el formato de los archivos que nadie había
      medido. Acotaba el panel del backtest y hacía que la validación del índice se declarara
      no concluyente por falta de potencia.
    impacto:
      medido_al_publicar: >-
        El panel pasó de 164 a 272 observaciones y la señal de underwriting pasó de no
        concluyente a concluyente, con Gini 0,2575 e intervalo [0,124 · 0,395]. El estado de
        validación del producto subió de 0,60 a 0,68.
    pr: 813

  - id: 2026-08-19-iai-contra-inversion
    fecha_efectiva: "2026-08-19"
    sectores: [agribusiness]
    titulo: "El índice sectorial se valida contra inversión realizada, con control por tamaño"
    que_cambio: >-
      El Gate E sectorial pasa a medirse también contra la inversión extranjera directa
      realizada por actividad, que es el desenlace que el índice dice anticipar, además del
      empleo. El desenlace primario es la intensidad —inversión por unidad de tamaño del
      sector— y se publica junto al mismo desenlace ordenado SOLO por tamaño: el deflactor es
      una variable del propio índice, así que sin ese control el signo del resultado no se le
      puede atribuir al índice.
    por_que: >-
      El índice se validaba contra crecimiento del empleo, que no es lo que dice anticipar, y
      daba nulo. Al medirlo contra inversión apareció que el control por tamaño reproduce el
      resultado casi exactamente, así que el índice no agrega poder por encima del tamaño del
      sector y se ofrece como descriptivo, no como predictivo.
    impacto:
      medido_al_publicar: >-
        Contra intensidad de inversión el índice da −0,321 y el tamaño solo −0,323; contra
        nivel, el índice da 0,287 y el tamaño solo 0,377.
    pr: [814, 815, 816]
