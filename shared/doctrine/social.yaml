# House doctrine — Eje 5: Social & desarrollo (Índice de Desarrollo Multidimensional)
# Doctrina §7: bienestar multidimensional > PIB; distribución > promedio;
# conducta/registro > percepción declarada. Atención a la informalidad (de Soto).
#
# IDM: 0-100, MAYOR = MAYOR desarrollo/bienestar.
version: "1.0"
name: IDM
direction: "mayor score = mayor desarrollo"

dimension_weights:
  health: 0.25
  education: 0.25
  living_standards: 0.25
  inclusion: 0.25

dimension_variables:
  health:
    - life_expectancy        # esperanza de vida (años)    mayor = mejor
    - child_mortality        # mortalidad infantil (‰)     mayor = peor
  education:
    - literacy_rate          # alfabetización (%)          mayor = mejor   [ENHOGAR por región]
    - schooling_years        # años de escolaridad         mayor = mejor   [SISDOM por región]
    - secondary_coverage     # cobertura neta secundaria (%) mayor = mejor [ONE por región + año]
  living_standards:
    - income_per_capita      # ingreso per cápita (RD$/mes) mayor = mejor  [SISDOM por región]
    - poverty_rate           # pobreza (%)                 mayor = peor
  inclusion:
    - financial_inclusion    # inclusión financiera (%)    mayor = mejor
    - informality_rate       # informalidad laboral (%)    mayor = peor

# Variables donde MAYOR valor = MENOR desarrollo → se invierten.
risk_increasing:
  - child_mortality
  - poverty_rate
  - informality_rate

bands:
  - {name: Alto,  lower: 70.0, color: "#047857"}
  - {name: Medio, lower: 40.0, color: "#F59E0B"}
  - {name: Bajo,  lower: 0.0,  color: "#991B1B"}

# Alcance de la medición por variable (default: per_subject). "national" = dato real de
# alcance país que se aplica IDÉNTICO a las 10 regiones: sostiene el NIVEL del índice
# pero no puede mover el orden entre demarcaciones.
#
# Declararlo importa y no es una formalidad. Cuatro de las nueve variables del IDM son
# nacionales, y sin este bloque el registro las reportaba como si se midieran por
# región: un consumidor leía "9 variables con dato real, por región" y concluía que el
# panel discrimina en el territorio cuando en realidad solo lo hacen cinco. El generador
# de procedencia (shared/registry/provenance.py) ahora lo dice al cliente.
# BÚSQUEDA HECHA Y AGOTADA (2026-08-10) para las dos de salud — anotada para que no se
# repita desde cero. NO son nacionales por falta de búsqueda:
#   * esperanza de vida: NO EXISTE con apertura sub-nacional. Cero hojas en las 108 del
#     libro de Salud del SISDOM; tampoco en CKAN. El Anuario de Estadísticas Vitales de
#     la ONE la traería, pero su portal está tras Cloudflare (403, ver one_client).
#   * mortalidad infantil: SÍ existe por provincia —SISDOM `04 3 035b`, las 32, dato
#     completo— pero SOLO en las rondas ENDESA de **2002 y 2007**. Dos puntos, el más
#     reciente de hace ~18 años. Cambiar la serie ANUAL VIVA de WDI por eso ganaría
#     discriminación territorial y perdería vigencia: todo período posterior a 2007
#     quedaría con el mismo número congelado — otra constante, con etiqueta provincial y
#     desactualizada. El intercambio es el INVERSO al del ingreso y la escolaridad, donde
#     se ganó apertura regional Y serie hasta 2024.
#     También hay apertura por "Región de salud" (I-VIII), que son OTRA geografía: 9
#     regiones sanitarias que no calzan con las 10 de desarrollo.
# Si algún día el Anuario de Estadísticas Vitales queda alcanzable, ahí están las
# defunciones por provincia y la cuenta se puede hacer con los nacimientos por provincia
# que la ONE sí publica en CKAN.
variable_scopes:
  life_expectancy: national     # WDI, país — sin fuente sub-nacional conocida
  child_mortality: national     # WDI, país — la provincial existe pero congelada en 2007
  informality_rate: national    # BCRD ENCFT, país
  financial_inclusion: national # BM Findex, cajeros/100k adultos, país
  # Variables que el panel INGIERE y el índice NO usa. Se declaran acá igual: el alcance
  # no depende de si alimentan el IDM, y tenerlo en dos lugares (la doctrina y un dict de
  # Python) fue tener dos verdades. Consumidores fuera del IDM —el eje de evaluación de
  # leyes— deciden con esto si una variable puede medir una meta NACIONAL.
  unemployment_rate: national            # BCRD ENCFT, promedio 4 trimestres, país
  employment_gender_ratio: national      # BCRD ENCFT, razón F/M, país
  unemployment_gender_ratio: national    # BCRD ENCFT, razón F/M, país
  secondary_coverage_pais: national      # MINERD SIIE, fila TOTAL PAIS
  primary_coverage_pais: national        # MINERD SIIE, fila TOTAL PAIS
  schooling_years_pais: national         # SISDOM 05 3 007, fila «Total»
  internet_users: national               # WDI IT.NET.USER.ZS (republica UIT)
  women_lower_house: national            # WDI SG.GEN.PARL.ZS (republica UIP)
  under5_mortality: national             # WDI SH.DYN.MORT (UN IGME)
  # poverty_extreme queda en el default per_subject: la ONE la publica por las 10 regiones
  # y NO hay agregado nacional en el panel. Publicar la de una región como cifra del país
  # es exactamente el defecto que costó cinco bindings el 2026-08-16.
  # Con desagregación real por demarcación quedan en el default per_subject:
  # schooling_years (SISDOM del MEPyD, 10 regiones) — pasó de nacional a regional el
  # 2026-08-10 al dejar la serie país de la ONE por el cuadro 05 3 007;
  # poverty_rate (ONE, 10 regiones), secondary_coverage (MINERD, 10 regiones + 32
  # provincias), literacy_rate (ENHOGAR, 10 regiones) e income_per_capita (SISDOM del
  # MEPyD, 10 regiones) — esta última pasó de nacional a regional el 2026-08-09 al
  # dejar el proxy horario de la ONE por el ingreso per cápita del hogar.

# Rúbrica declarada (Gate C) — defaults NEUTRAL 50 usados solo como respaldo si una
# variable no tiene dato real para el período (uniforme: no discrimina ni finge; un
# valor parcial distorsionaría el min-max).
# Estado por variable: poverty_rate = ONE por región ✅; salud (life_expectancy/
# child_mortality) = WDI nacional ✅; informality_rate = BCRD (ENCFT) nacional ✅ (match
# exacto, fuente primaria); income_per_capita = SISDOM (VAES/MEPyD) cuadro 03 3 021,
# ingreso familiar mensual por persona POR REGIÓN 2000-2024 ✅ (ya no es proxy: es la
# variable exacta, y desde 2026-08-09 discrimina entre demarcaciones); literacy_rate =
# ONE ENHOGAR por región, extracción IA ✅ (live si las 10 regiones tienen el dato);
# schooling_years = SISDOM (VAES/MEPyD) cuadro 05 3 007, escolaridad promedio POR REGIÓN
# 2000-2024 ✅ (desde 2026-08-10 discrimina entre demarcaciones: 2,3 años entre Ozama y
# Enriquillo, que la serie nacional de la ONE escondía); secondary_coverage = MINERD
# (tablero SIIE) cobertura neta secundaria por región + año ✅ (acceso educativo
# regional+temporal); financial_inclusion = BM Findex cajeros/100k adultos (proxy de
# acceso, nacional anual) ✅. Las 9 variables del IDM en dato real. La UI marca cada
# variable real-vs-rúbrica.
rubric_defaults:
  income_per_capita: 50
  literacy_rate: 50
  schooling_years: 50
  financial_inclusion: 50
  informality_rate: 50
  secondary_coverage: 50

# Prosa CITABLE A CLIENTE, una por dimensión (Hallazgo 7). Lo ÚNICO que el retrieval indexa de
# este archivo; el resto (pesos, variables, bandas, rúbrica) lo lee el motor de scoring directo.
# REGLA (2026-07-22): el rationale declara SOLO LO DURABLE — qué mide y por qué pesa. La
# procedencia (real/rúbrica/brecha) la genera el registro en Metodología; gate de CI la veta aquí.
dimension_rationales:
  health: "Salud de la población: esperanza de vida al nacer y mortalidad infantil. Las cuatro dimensiones del índice pesan igual: el desarrollo multidimensional no jerarquiza una carencia sobre otra."
  education: "Educación: alfabetización, cobertura secundaria neta y años promedio de escolaridad, las tres por región de desarrollo. La alfabetización mide el piso, la escolaridad la acumulación de años y la cobertura el acceso presente; se leen juntas porque una población con escolaridad alta puede convivir con cobertura actual deteriorada."
  living_standards: "Nivel de vida: ingreso familiar mensual por persona y tasa de pobreza, ambos por región de desarrollo. El ingreso mide la capacidad de compra del hogar y la pobreza el corte por debajo del cual esa capacidad no alcanza la canasta básica; se leen juntos porque un ingreso medio alto convive con incidencia alta cuando la distribución interna es desigual."
  inclusion: "Inclusión económica: acceso al sistema financiero (densidad de cajeros como aproximación de acceso) e informalidad laboral."
