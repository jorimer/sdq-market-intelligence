  # ── Confisa: el caso que prueba el registro en la dirección CONTRARIA ──────
  # El registro histórico lo listaba como liquidado, y los indicadores lo desmienten. La serie
  # no tiene discontinuidad: los activos crecen a través de la transición (656 M → 708 M →
  # 744 M) y siguen hasta 5.087 M en 2025-12, con la morosidad en 0.59% y la cobertura en
  # 270%. Una quiebra se ve al revés — los activos se desploman o se transfieren.
  #
  # Sí hubo un episodio de estrés real: entre 2002-06 y 2002-12 la morosidad salta de 2.40% a
  # 12.23% y la cobertura cae de 131.7% a 23.0%, que es la crisis de 2003 golpeando. Pero se
  # recupera: cobertura 125% en 2005-12. La liquidación "de divisiones no absorbibles" que
  # menciona el registro fue de LÍNEAS DE NEGOCIO; la institución licenciada continuó, y el
  # ledger solo ve instituciones.
  #
  # Registrarlo como quiebra habría metido en la cohorte a una entidad que hoy reporta 5 mil
  # millones en activos. Que la curaduría también pueda QUITAR quiebras —y no solo agregarlas—
  # es lo que la hace una fuente y no una lista de deseos.

  - nombre: Financiera Confisa
    fecha_salida: 2000-03-01
    causa: renombre
    episodio: Pasa a operar como Banco Confisa de Desarrollo y Crédito
    fuente: >-
