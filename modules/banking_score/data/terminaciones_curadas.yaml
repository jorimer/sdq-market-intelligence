      locales que el Banco de Santander vendió al no poder expandirse en RD. En 1987 lo
      compra el Banco Universal y pasa a operar dentro del Grupo Financiero Banco Español,
      bajo las directrices de Universal (productos compartidos, Visa Banco Español / Visa
      Universal). En diciembre de 1992 la SB interviene el holding completo y la resolución
      de quiebra alcanza de forma solidaria a todas las filiales, hundiendo a la vez a
      Universal y al grupo. Sus ahorrantes entraron unificados a la tercera fase de "Dinero
      Busca Dueño" (2023). La fecha de este registro es la del último reporte separado en el
      ledger (1990-11); la intervención formal es de dic-1992, cuando ya operaba integrado.

