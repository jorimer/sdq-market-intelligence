# Registro CURADO de terminaciones del sistema financiero dominicano.
#
# Por qué existe. La clasificación automática de `validation/terminaciones.py` infiere la
# naturaleza de una salida a partir de los ratios con que la entidad dejó de reportar. Eso
# alcanza para un borrador, pero mete el predictor adentro de la etiqueta: si "insolvencia"
# se define por morosidad y después la morosidad se usa para predecir insolvencia, el modelo
# se mide contra sí mismo. A seis meses de la salida el AUC daba 0.874 y el peso colapsaba
# entero a morosidad — tautología con retardo, no predicción.
#
# Ninguna estadística arregla eso. La cura es que la etiqueta venga de AFUERA de los ratios:
# de lo que se sabe que pasó con la entidad. Este archivo es esa fuente.
#
# Cómo se usa. `causa` es la etiqueta curada y manda sobre la inferida. Las salidas que no
# están acá quedan como INFERIDAS y se cuentan aparte: un modelo calibrado sobre etiquetas
# inferidas se reporta como diagnóstico contaminado, no como validación — mismo estándar que
# `deal_scoring` aplica a sus labels retrospectivos.
#
# Cómo se extiende. Cuando una entidad sale del sistema, se agrega una fila con su causa y su
# fuente. Eso es el lazo: el modelo base se re-ajusta con un caso más, y la corrida es
# `validation/ew_calibration.py`.
#
# causa:
#   quiebra          insolvencia o intervención — la entidad murió, cualquiera fuera la forma legal
#   fusion           absorbida o fusionada estando viable
#   salida_voluntaria cierre de operación local, venta ordenada, devolución de licencia
#   renombre         la misma institución sigue con otro nombre (NO es una terminación)
#   desconocida      se sabe que salió pero no por qué — NO se usa como etiqueta
#
# REGLA: no se escribe una causa sin `fuente`. Una etiqueta sin procedencia es exactamente el
# problema que este archivo vino a resolver.

