# Registro CURADO de terminaciones del sistema financiero dominicano.
#
# Por qué existe. La clasificación automática de `validation/terminaciones.py` infiere la
# naturaleza de una salida a partir de los ratios con que la entidad dejó de reportar. Eso
# alcanza para un borrador, pero mete el predictor adentro de la etiqueta: si "insolvencia"
# se define por morosidad y después la morosidad se usa para predecir insolvencia, el modelo
# se mide contra sí mismo. A seis meses de la salida el AUC daba 0.874 y el peso colapsaba
# entero a morosidad — tautología con retardo, no predicción.
#
# Ninguna estadística arregla eso. La cura es que la etiqueta venga de AFUERA de los ratios:
# de lo que se sabe que pasó con la entidad. Este archivo es esa fuente.
#
# Cómo se usa. `causa` es la etiqueta curada y manda sobre la inferida. Las salidas que no
# están acá quedan como INFERIDAS y se cuentan aparte: un modelo calibrado sobre etiquetas
# inferidas se reporta como diagnóstico contaminado, no como validación — mismo estándar que
# `deal_scoring` aplica a sus labels retrospectivos.
#
# Cómo se extiende. Cuando una entidad sale del sistema, se agrega una fila con su causa y su
# fuente. Eso es el lazo: el modelo base se re-ajusta con un caso más, y la corrida es
# `validation/ew_calibration.py`.
#
# causa:
#   quiebra          insolvencia o intervención — la entidad murió, cualquiera fuera la forma legal
#   fusion           absorbida o fusionada estando viable
#   salida_voluntaria cierre de operación local, venta ordenada, devolución de licencia
#   renombre         la misma institución sigue con otro nombre (NO es una terminación)
#   desconocida      se sabe que salió pero no por qué — NO se usa como etiqueta
#
# REGLA: no se escribe una causa sin `fuente`. Una etiqueta sin procedencia es exactamente el
# problema que este archivo vino a resolver.

version: 1
actualizado: 2026-08-15

terminaciones:

  # ── Crisis bancaria de 2003 ────────────────────────────────────────────────
  - nombre: Banco Intercontinental (Baninter)
    fecha_salida: 2003-05-01
    causa: quiebra
    episodio: Crisis 2003 (fraude)
    fuente: >-
      Panel de Expertos BCRD 2005; Fitch 2003. Intervención de la SB en mayo de 2003.
      Cohorte del backtest en `sib_historical_backtest.FAILED_COHORT`.

  - nombre: Banco Nacional de Crédito
    fecha_salida: 2003-12-01
    causa: quiebra
    episodio: Crisis 2003 (Bancrédito — quiebra con fraude)
    fuente: >-
      Confirmado por el dueño: cierre por quiebra y fraude. Panel de Expertos BCRD 2005.
      Absorbido por Banco León; el ledger reutiliza el código `BANCRÉDITO - LEÓN`, por eso la
      salida solo es visible keyeando por institución y no por código.

  - nombre: Banco Mercantil
    fecha_salida: 2005-03-01
    causa: quiebra
    episodio: Crisis 2003
    fuente: >-
      Panel de Expertos BCRD 2005. Absorbido por Republic Bank; código compartido
      `MERCANTIL - REPUBLIC BANK`.

  - nombre: Banco Global
    fecha_salida: 2002-07-01
    causa: quiebra
    episodio: Crisis 2003
    fuente: Panel de Expertos BCRD 2005; cohorte del backtest.

  # ── Episodio de quiebras de inicios de los 90 ──────────────────────────────
  # Confirmadas por el dueño; la fecha de salida es el último mes reportado en el ledger.
  - nombre: Banco Universal
    fecha_salida: 1992-09-01
    causa: quiebra
    episodio: Quiebras inicios de los 90
    fuente: Confirmado por el dueño (roster histórico); cohorte del backtest.

  - nombre: Banco Panamericano
    fecha_salida: 1992-04-01
    causa: quiebra
    episodio: Quiebras inicios de los 90
    fuente: >-
      Confirmado por el dueño. Serie corta (~17 meses): el fechado del inicio del deterioro
      es menos fiable, pero la salida es una quiebra conocida.

  # ── Fraude posterior ───────────────────────────────────────────────────────
  - nombre: Banco Peravia de Ahorro y Crédito
    fecha_salida: 2014-06-01
    causa: quiebra
    episodio: Fraude 2014
    fuente: >-
      Anexo del diseño Fase 1 (`docs/SIB_HISTORICO_FASE1_DISENO.md`). Entidad pequeña: el
      backtest la excluye del fechado por ruido de escala, pero la CAUSA es conocida.

  # ── Salidas que NO son quiebras ────────────────────────────────────────────
  # Tan necesarias como las quiebras: sin casos del lado negativo no hay contra qué medir si
  # el clasificador sabe DESCARTAR.
  #
  # El linaje BHD, confirmado por el dueño y verificado contra el panel:
  #   Banco Profesional → Banco León → (fusión con Banco BHD) → BHD León → Banco BHD (vivo)
  # De los cuatro nombres que el clasificador reporta como "cerrados" bajo este linaje, TRES
  # son la misma institución cambiando de nombre. Contarlos como salidas metía casos falsos
  # en la cohorte — el reverso exacto del problema de Bancrédito, donde un código escondía una
  # quiebra real. El código miente en las dos direcciones.

  - nombre: Banco Profesional
    fecha_salida: 2005-02-01
    causa: renombre
    episodio: Se convierte en Banco León (2003) al adquirir Bancrédito
    fuente: >-
      Confirmado por el dueño: el Banco Profesional (nacido en 1999 de la transformación de
      la Financiera Profesional, por la Familia León) pasó a llamarse Banco León en 2003 tras
      integrar operaciones y activos de Bancrédito; en 2014 se fusionó con Banco BHD.
      RESUELVE la anomalía que este archivo tenía anotada: el código `PROFESIONAL` cierra con
      36.7% de morosidad, casi el espejo del 33.3% con que Bancrédito cierra tres meses
      antes. El banco continuó como Banco León en el slot de Bancrédito desde 2004-01 con
      ratios limpios (mora 3.8%); lo que siguió reportando bajo el código viejo hasta 2005-02
      fue el residuo de la cartera absorbida, no la insolvencia de Banco Profesional. Es el
      mismo fenómeno de Bancrédito visto desde el otro lado: el código sigue a la CARTERA, no
      a la institución.

  - nombre: Banco Comercial BHD
    fecha_salida: 1992-12-01
    causa: renombre
    episodio: Pasa a operar como Banco BHD
    fuente: >-
      Verificado en el panel: el código `BHD` continúa sin interrupción como "Banco BHD"
      desde 1993-12. Misma institución.

  - nombre: Banco León
    fecha_salida: 2014-08-01
    causa: fusion
    episodio: Fusión BHD-León (2014)
    fuente: >-
      Confirmado por el dueño. Sale sana —morosidad 3.8%— el mismo mes que Banco BHD, que es
      la firma de una fusión entre entidades viables y no de un rescate.

  - nombre: Banco BHD
    fecha_salida: 2014-08-01
    causa: fusion
    episodio: Fusión BHD-León (2014)
    fuente: Confirmado por el dueño. Sale sana (morosidad 3.2%) el mismo mes que Banco León.

  - nombre: Banco BHD León
    fecha_salida: 2022-02-01
    causa: renombre
    episodio: Vuelve a operar como Banco BHD
    fuente: >-
      Verificado en el panel: "Banco BHD" reporta sin interrupción desde 2022-03 hasta el
      final de la serie. La institución está viva; no hay terminación que registrar.

  - nombre: Banco de la Pequeña Empresa
    fecha_salida: 2004-06-01
    causa: renombre
    episodio: Pasa a operar como Banco de Ahorro y Crédito Pyme BHD
    fuente: >-
      Verificado en el panel: el código `PEQ EMPRESA - PYME BHD` continúa sin interrupción
      con el nombre nuevo desde 2004-07.

  # ── Banca extranjera que se retiró del mercado local ───────────────────────
  # Las tres salen SIN morosidad reportada —la era temprana del ledger apenas la publica—, así
  # que la inferencia solo puede decir `no_evaluable` y las deja en el limbo. Son casos
  # valiosos justamente por eso: entidades longevas y sanas que se fueron por estrategia, no
  # por deterioro. Sin ellas, el clasificador no tiene contra qué demostrar que sabe DESCARTAR.
  - nombre: The Royal Bank of Canada
    fecha_salida: 1985-07-01
    causa: salida_voluntaria
    episodio: Retiro del mercado dominicano
    fuente: >-
      Confirmado por el dueño: una de las primeras instituciones internacionales en formalizar
      la banca en RD (operaciones desde ~1908); vendió y liquidó sus carteras locales por
      cambio de estrategia internacional y por la consolidación de la banca dominicana.
      Mantiene RBC Caribbean en otras islas, sin presencia en territorio dominicano.
      Verificado en el panel: 375 meses de serie continua, 1947-10 a 1985-07.

  - nombre: Banco Español
    fecha_salida: 1990-11-01
    causa: salida_voluntaria
    episodio: Retiro tras la reestructuración del sistema financiero dominicano
    fuente: >-
      Confirmado por el dueño: operó varias décadas junto a otras entidades extranjeras
      tradicionales y se retiró formalmente tras la reestructuración del sistema financiero.
      Hoy no hay banca comercial española con sucursales minoristas en RD. Verificado en el
      panel: 370 meses de serie continua, 1949-12 a 1990-11.

  - nombre: Bank of America
    fecha_salida: 1984-12-01
    causa: salida_voluntaria
    episodio: Cierre de la operación local
    fuente: >-
      Confirmado por el dueño: no tiene sucursales ni oficinas comerciales en el país; el
      único banco corporativo de origen estadounidense con licencia vigente es Citibank. Su
      vínculo actual con RD es de corresponsalía y análisis macro, no de banca local.
      Verificado en el panel: 172 meses de serie continua, 1968-03 a 1984-12.

  # Mismo patrón que el linaje BHD: el clasificador lee un cierre donde hubo un cambio de
  # nombre. La institución reporta sin interrupción desde 1947 hasta el final del panel.
  - nombre: The Bank of Nova Scotia
    fecha_salida: 2020-05-01
    causa: renombre
    episodio: Pasa a operar como Scotiabank República Dominicana
    fuente: >-
      Confirmado por el dueño: Scotiabank es el banco canadiense con presencia comercial
      vigente en RD. Verificado en el panel: el código `SCOTIABANK` continúa sin interrupción
      como "Scotiabank República Dominicana" desde 2020-06 hasta el cierre de la serie.

  - nombre: Banco de Ahorro y Crédito Pyme BHD
    fecha_salida: 2012-12-01
    causa: fusion
    episodio: Absorbido por la matriz; el negocio Pyme queda como segmento del Banco BHD
    fuente: >-
      Confirmado por el dueño: hoy NO existe una entidad legal independiente con ese nombre —
      la Banca Pyme opera como segmento dentro del Banco BHD, bajo su licencia de Banco
      Múltiple. La entidad que reportó hasta 2012-12 sí era una licencia separada de ahorro y
      crédito (por eso figura en el ledger de la SB, que solo lista licenciadas), y salió sana:
      morosidad 2.9%. Es una absorción por la matriz, no una caída.
