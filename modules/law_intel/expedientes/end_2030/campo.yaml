# EL ESTADO DEL CAMPO — por qué cada indicador de la ley que NO tiene veredicto no lo tiene.
#
# Existe para que ninguno de los 90 quede en silencio. Un indicador sin veredicto y sin motivo
# es indistinguible de uno que nadie miró, y esa ambigüedad es la que vuelve inauditable un
# informe de cumplimiento.
#
# LO QUE ESTE ARCHIVO NO DECLARA. Los estados que se computan del registro o del binding no se
# escriben acá: `sin_meta_legal`, `meta_no_interpretable`, `candidato_descartado` y
# `candidato_sin_verificar` salen solos, y declararlos a mano sería tener dos verdades sobre el
# mismo hecho. El motor rechaza la duplicación.
#
# LA DISTINCIÓN QUE SOSTIENE EL ARCHIVO. «Buscamos y no hay» y «no hemos buscado» son estados
# distintos. Los cuatro estados que afirman algo sobre el mundo llevan evidencia CON FECHA;
# sin ella el motor los rechaza y obliga a declararlos como pendientes. Decir que una fuente no
# existe sin haberla buscado es publicar una conjetura.

motivos:

  # ══ MOTIVO DEFINITIVO, con evidencia ══════════════════════════════════════════════════
  - indicador: "3.11"
    estado: fuente_no_procesable
    detalle: >-
      El MESCyT es el emisor competente y publica su estadística de educación superior como
      informe anual en PDF, sin Excel ni CSV. Extraer la serie exigiría leer cuadros de un
      documento de cientos de páginas por año.
    evidencia: >-
      `mescyt.gob.do/publicaciones-estadisticas/` sirve los informes anuales 1989-2024 solo en
      PDF (informe 2023: 434 páginas, 138 cuadros). El tablero de estadísticas no expone datos
      extraíbles. En el catálogo nacional de datos abiertos el MESCyT publica cinco conjuntos,
      todos operativos (becas, exequátur, nómina), ninguno con la estadística de acreditación.
    verificado_el: "2026-08-20"
  - indicador: "3.12"
    estado: fuente_no_procesable
    detalle: >-
      Mismo emisor y mismo formato que el 3.11: el conteo de programas acreditados vive en el
      mismo informe anual en PDF.
    evidencia: >-
      Ver la evidencia del indicador 3.11, verificada contra el portal del MESCyT y contra el
      catálogo nacional de datos abiertos.
    verificado_el: "2026-08-20"
  - indicador: "4.4"
    estado: magnitud_no_publicada
    detalle: >-
      El INAPA existe, publica datos abiertos y no publica esta magnitud. Sus conjuntos son
      operativos: nómina, cloro residual, alcantarillados colocados y cobertura de potabilidad.
      La eficiencia de uso del agua en redes de distribución no está entre ellos.
    evidencia: >-
      Búsqueda en el catálogo nacional de datos abiertos: «eficiencia agua» devuelve cero
      conjuntos; «agua no contabilizada» devuelve uno, del INDRHI y sobre calidad del agua, no
      sobre eficiencia de red. El INAPA publica seis conjuntos, todos operativos.
    verificado_el: "2026-08-20"
  - indicador: "3.30"
    estado: fuente_no_procesable
    detalle: >-
      El monto está en el anexo del Informe de Desempeño del MEM, en la hoja de resultados
      financieros. Esa hoja no tiene cabecera de años y su fila se mueve entre ediciones, así
      que leerla por posición fabricaría procedencia. Las otras tres magnitudes eléctricas del
      mismo anexo sí se leen, porque su hoja declara los años y las filas se buscan por
      etiqueta.
    evidencia: >-
      Anexos de diciembre de 2021 y de 2024 del MEM: la fila «Aportes del gobierno / Cubrir
      Déficit Operacional» está en f63 en la edición de 2021 y en f64 en la de 2024, y la
      cabecera de la hoja es un título, no una fila de años.
    verificado_el: "2026-08-21"

  # ══ LA SERIE EXISTE; FALTA DEFINIR LA DERIVACIÓN ══════════════════════════════════════
  # No es que falte fuente. Falta resolver un denominador, un cociente o una convención, y
  # cada una de esas decisiones cambia la cifra que se publicaría.
  - indicador: "2.36"
    estado: pendiente_de_derivacion
    detalle: >-
      La serie de afiliación al Seguro Familiar de Salud está conectada y es mensual desde
      2007. Falta la convención de anualización, y no es un detalle: los doce valores de 2010
      van de 36,2% a 44,9% de la población, así que la elección mueve el resultado 8,6 puntos
      contra una línea base legal de 42,4%. Antes de fijarla conviene comprobar si el propio
      emisor publica el porcentaje, porque quien conoce el denominador correcto es él.
  - indicador: "2.3"
    estado: pendiente_de_derivacion
    detalle: >-
      La pobreza por zona urbana y rural la produce el mismo emisor cuyo panel regional ya se
      ingiere. Falta identificar la serie rural y contrastarla contra la línea base legal.
  - indicador: "2.6"
    estado: pendiente_de_derivacion
    detalle: Igual que el 2.3, sobre la línea de pobreza moderada.
  - indicador: "3.18"
    estado: pendiente_de_derivacion
    detalle: >-
      Participación de las exportaciones dominicanas en las exportaciones mundiales. El
      numerador ya se ingiere; falta el agregado mundial del mismo emisor y el cociente. La
      línea base de la ley es un promedio de años, así que este indicador no tiene oráculo.
  - indicador: "3.19"
    estado: pendiente_de_derivacion
    detalle: Igual que el 3.18, sobre exportaciones de manufacturas.
  - indicador: "3.20"
    estado: pendiente_de_derivacion
    detalle: Igual que el 3.18, sobre exportaciones de productos agropecuarios.

  # ══ NO SE HA BUSCADO FUENTE ═══════════════════════════════════════════════════════════
  # Estado honesto y deliberado. Estos son trabajo nuestro pendiente, no hallazgos.
  - indicador: "1.1"
    estado: pendiente_de_busqueda
    detalle: >-
      Confianza en los partidos políticos, base 22,2% en 2010 y meta 40,1% para 2030. Lo
      miden encuestas regionales de opinión pública y la ley NO nombra ninguna, así que acá
      la admisibilidad no se resuelve por la vía de los otros: el instrumento no incorpora a
      la fuente, y la lista blanca del expediente admite terceros cuando republican dato
      nacional o cuando la ley los nombra. Una encuesta de opinión de un tercero no es ni una
      cosa ni la otra.
      DECISIÓN PREVIA, del dueño y no de datos: si una encuesta regional de opinión califica
      como fuente para este eje. Buscar el dato antes de responder eso sería trabajo que
      puede terminar inadmisible.
  - indicador: "1.2"
    estado: instrumento_discontinuado
    evidencia: >-
      Descargado el archivo de resultados vigente del emisor —«CPI2024-Results-and-trends»—
      y leídas sus dos hojas de serie. La que el propio emisor titula «CPI Historical»
      EMPIEZA EN 2012 y llega a 2024; la otra se titula «CPI Timeseries 2012 - 2024». El
      emisor no publica 2010 en ninguna escala, ni el tramo 0-10 sobre el que la ley fijó su
      línea base de 3,0 y sus cuatro metas (3,9 · 4,8 · 5,9 · 7,0).
      Serie que sí publica, en 0-100: 32 (2012) · 28 (2019) · 36 (2024).
    verificado_el: "2026-08-22"
    detalle: >-
      Índice de percepción de la corrupción. La ley NOMBRA el índice, así que la fuente es
      admisible por la misma lógica que la PEFA y el LLECE: la propia ley la incorpora. Lo
      que no sobrevive es la ESCALA. El emisor cambió de metodología en 2012, pasó a 0-100 y
      su publicación vigente arranca ahí; las metas de la ley están en el tramo anterior.
      Es exactamente el caso de los puntajes LLECE (2.12 a 2.16) y se resuelve igual: sin
      puente publicado del 0-100 al 0-10, construirlo por cuenta propia sería inventar la
      conversión. Dividir por diez parece inocente y no lo es — el cambio de 2012 no fue de
      notación sino de agregación, y el emisor declara que los tramos no son comparables.
      QUÉ HARÍA FALTA para reabrirlo: que el emisor publique un puente entre las dos escalas,
      o una decisión del dueño de aceptar una conversión lineal con la salvedad impresa. Bajo
      cualquier conversión monótona el veredicto es el mismo —36 sobre 100 queda por debajo
      de la meta de 2015— pero eso es un argumento de margen, no un puente.
  - indicador: "1.3"
    estado: instrumento_discontinuado
    evidencia: >-
      IDENTIFICADO POR ORÁCULO, exacto. El «índice de fortaleza institucional» que la ley no
      nombra es el PRIMER PILAR —Institutions— del Índice Global de Competitividad del Foro
      Económico Mundial. El informe 2010-2011 de ese emisor, página de perfil de República
      Dominicana, publica «1st pillar: Institutions ... 3.2» en escala 1-7, y la ley fija
      exactamente 3,2 para 2010. Δ 0%.
      Y el instrumento ya no existe: la última edición regular con índice es la de 2019. La
      de 2020 es una «Special Edition» —publicada el 16 de diciembre de 2020— dedicada a
      prioridades de recuperación, que no produce el índice, y no hay ediciones posteriores
      en la serie del emisor.
    verificado_el: "2026-08-22"
    detalle: >-
      La consecuencia es sobre la LEY, no sobre nosotros: sus metas de 2020, 2025 y 2030
      (4,0 · 4,5 · 5,0) están fijadas contra un instrumento que dejó de producirse el año
      anterior al primero de esos cortes. No hay forma de medirlas y no la habrá.
      Es el mismo desenlace que el 3.9, que es el índice GENERAL del mismo emisor y ya estaba
      descartado por lo mismo. La diferencia es que ahora está probado que el 1.3 pertenece a
      esa familia en vez de sospechado por la escala.
  - indicador: "1.4"
    estado: pendiente_de_busqueda
    detalle: >-
      Índice de desarrollo burocrático. Sin emisor nombrado, escala 0-1 (base 0,38 en 2006,
      meta 0,9) y una particularidad que ninguno de los otros tiene: su línea base es cuatro
      años ANTERIOR a la del resto del eje. Eso apunta a una medición puntual —un informe
      regional sobre el servicio civil, no una serie anual— y si lo fuera, el indicador no
      tendría con qué actualizarse aunque se identifique al emisor.
      Antes de buscar el dato hay que decidir si una medición puntual de un tercero, repetida
      una sola vez, califica como fuente para este eje. Es la misma decisión del 1.1.
  - indicador: "3.15"
    estado: instrumento_discontinuado
    evidencia: >-
      Mismo emisor y mismo informe que el 1.3, segundo pilar. El informe 2008-2009 del Foro
      Económico Mundial publica para República Dominicana «2nd pillar: Infrastructure ...
      3.1» en escala 1-7, contra los 3,0 que la ley fija para 2008: Δ 3,3%. No cierra al 2%
      como el 1.3, pero la identificación se apoya en tres patas —la coincidencia exacta del
      pilar hermano, la escala, y que la propia ley nombra a este emisor en los indicadores
      3.16 y 3.17—.
      El instrumento está discontinuado por la misma evidencia que el 1.3: última edición
      regular en 2019, edición especial sin índice el 16 de diciembre de 2020, nada después.
    verificado_el: "2026-08-22"
    detalle: >-
      Sus metas de 2020, 2025 y 2030 (4,5 · 5,3 · 6,0) no se pueden medir ni se podrán. El
      residuo de 3,3% contra la línea base no cambia el desenlace: aunque la edición que usó
      el legislador fuera otra, el instrumento igual dejó de existir.
  - indicador: "3.16"
    estado: instrumento_discontinuado
    evidencia: >-
      Lo declara el propio emisor, con fecha. El informe «Travel & Tourism Development Index
      2021», publicado el 24 de mayo de 2022, abre diciendo que ese índice «is an evolution
      of the 15-year-old Travel & Tourism Competitiveness Index (TTCI) series» y que
      «important changes have been made between the TTCI and the TTDI», enumerando pilares
      NUEVOS —Non-Leisure Resources, Socioeconomic Resilience and Conditions, y T&T Demand
      Pressure and Impact—. La edición 2024, publicada el 21 de mayo de 2024, se compone de
      «five dimensions, 17 pillars and 102 individual indicators».
      El índice que la ley nombró —el de competitividad— dejó de publicarse; lo que hay es
      otro índice, con otro marco. Corroborado en una segunda superficie del mismo emisor: su
      página vigente de la iniciativa del sector ofrece, bajo «Tools and Resources», el
      «Travel & Tourism Development Index 2024» como la herramienta de benchmarking del
      sector, y no menciona al índice de competitividad en ninguna parte.
    verificado_el: "2026-08-22"
    detalle: >-
      LA TRAMPA DE ESTE CASO, y por eso conviene dejarla escrita: el sucesor conserva la
      escala 1-7. Un lector puede tomar el puntaje de hoy y compararlo con la línea base de
      4,0 que la ley fija para 2009 sin que nada se vea mal. Es peor que un cambio de escala
      como el del LLECE o el del índice de corrupción, donde la incompatibilidad salta a la
      vista: acá los números son del mismo rango y miden marcos distintos.
  - indicador: "3.17"
    estado: instrumento_discontinuado
    evidencia: >-
      Mismo informe y misma evidencia que el 3.16, y con un agravante propio. El pilar que la
      ley nombra —sostenibilidad ambiental— sobrevive por NOMBRE en el sucesor: la edición
      2024 lo lista como «Environmental Sustainability», pero descompuesto en subpilares que
      el índice original no tenía —«T&T Energy Sustainability, Pollution and Environmental
      Conditions, and Preservation of Nature»— y dentro de una dimensión de sostenibilidad
      que se creó en el rediseño.
    verificado_el: "2026-08-22"
    detalle: >-
      Un pilar que conserva el nombre y cambia de composición es el caso más difícil de todo
      el expediente: no hay ni cambio de escala ni cambio de rótulo que avise. Sus metas
      —hasta 6,3 para 2030— quedan sin instrumento con el que medirse.
  - indicador: "2.26"
    estado: pendiente_de_busqueda
    detalle: >-
      Tasa de letalidad asociada al dengue. Probado el 2026-08-21 contra el catálogo nacional
      de datos abiertos: «dengue», «letalidad» y «boletín epidemiológico» devuelven CERO
      conjuntos. El portal de la autoridad sanitaria no respondió en esa consulta, así que
      falta comprobar si publica sus boletines por fuera del catálogo. Un cero del catálogo es
      evidencia sobre el catálogo, no sobre el emisor: el MESCyT publica y tampoco está ahí.
  - indicador: "2.40"
    estado: pendiente_de_busqueda
    detalle: >-
      Brecha de género en ingreso laboral. Probado el 2026-08-22 contra el portal del emisor,
      que es donde se resolvió el 2.38: su libro de indicadores trae hojas «Masculino» y
      «Femenino» —de ahí salen las dos razones de género que ya se ingieren— y NINGUNA de las
      dos tiene fila de ingreso. Sus diez libros de ingresos abren por grupo ocupacional,
      categoría, nivel, rama y tramos, y ninguno por sexo.
      Queda una pista de la forma: esos libros publican «ingresos por hora», y una razón
      HORARIA explicaría que la ley fije una línea base de 0,95 —casi paridad— cuando la
      brecha mensual es mayor. Si el corte por sexo del ingreso horario existe, es ahí.
