# SELLO DE RATIFICACIÓN — las metas se aprueban UNA VEZ y después no se mueven.
#
# `hash_metas` cubre id, escala, línea base y metas de las 135 filas. Si el registro deja de
# coincidir con este hash y ninguna enmienda de abajo lo autoriza, el expediente NO SE SIRVE:
# el motor levanta `DerivaNoAutorizada`.
#
# Por qué es tan duro: el hallazgo central de este mismo expediente es el artículo 20, que
# deja al órgano rector —el evaluado— cambiar las metas por vía administrativa. Un evaluador
# cuyo propio registro se puede editar sin rastro tiene el mismo defecto que denuncia, y con
# menos excusa, porque nosotros elegimos el diseño.
#
# Para cambiar una meta hay que agregar una enmienda con la norma que la autoriza y su hash
# resultante. No alcanza con citar una norma real: el hash tiene que coincidir exactamente con
# el registro resultante, para que una norma verdadera no sirva de paraguas a un cambio
# distinto del que autorizó.

sello:
  hash_metas: e696148532394149e05eea851de9a04825a4b00542eaa2c8a08ab0dc3e500943
  fecha: "2026-08-15"
  aprobado_por: SDQ Consulting Group
  base: >-
    Metas leídas del articulado de la Ley 1-12 (arts. 22, 24, 26 y 28). 21 de ellas
    contrastadas una por una contra el texto legal; el resto por lectura de celdas del PDF
    oficial.

verificaciones:
  - fecha: "2026-08-20"
    alcance: >-
      Las 90 líneas base numeradas, contrastadas por extracción de TABLAS contra el PDF
      oficial de la END 2030 (págs. 51-75). Resultado: CERO discrepancias. Las seis que la
      primera pasada marcó eran del comparador y no del dato — la ley escribe «421 (Nivel I)»
      y «2.24%», no números pelados.
    motivo: >-
      Se hizo al descubrir que SIETE nombres de indicador estaban truncados en 120 caracteres
      exactos, y que el del 2.17 escondía que el indicador cubre TRES materias. La pregunta
      obvia era si el mismo corte había tocado los campos sellados.
      No los tocó, y la razón no es casualidad: los campos bajo el hash recibieron la
      disciplina de la ratificación y el nombre nunca estuvo bajo ella. El sello protegió
      exactamente lo que dice proteger.
    hallazgo_lateral: >-
      La fila del 2.12 en el articulado publica los cortes de nivel en escala SERCE —«Nivel I
      > 299,59 · Nivel II > 424,54 · Nivel III > 513,66 · Nivel IV > 593,59»—. Es confirmación
      INDEPENDIENTE de que la ley fijó sus niveles con puntajes de la escala de 2006, que es
      lo que impide leer un puntaje de ERCE 2019 contra sus metas.

