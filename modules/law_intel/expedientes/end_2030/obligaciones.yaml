# OBLIGACIONES — qué manda la ley hacer, a quién, con qué plazo y qué pasa si no.
#
# **La distinción que más importa acá.** `incumplida` y `sin_registro_publico` NO son lo
# mismo, y confundirlas es el peor error que este producto puede cometer:
#
#   incumplida            hay evidencia de que no se hizo. Exige `evidencia`.
#   sin_registro_publico  no se encontró registro. NO es una afirmación de incumplimiento.
#
# El cliente del informe es, muchas veces, el órgano al que la obligación le corresponde. Una
# afirmación negativa sin verificar dirigida al propio Congreso —«la Comisión Bicameral nunca
# se constituyó»— es refutable en una audiencia con un solo documento, y se lleva puesto el
# informe entero. El motor no deja publicar la primera con la evidencia de la segunda.
#
# `consecuencia: null` es el hallazgo central del expediente, no un campo sin llenar: ninguno
# de los mecanismos de control que la ley previó tiene efecto jurídico asignado a su no
# activación. Se declara explícitamente para que se pueda contar.

version: "1.0"

obligaciones:
  - id: art-41-informe-anual
    articulo: 41
    sin_consulta_normativa: >-
      El cumplimiento es CONVOCAR una reunión y PUBLICAR un informe. Ninguno de los dos actos se dicta ni se publica en la Gaceta Oficial, así que la base normativa no puede verlos: una consulta sobre ellos devolvería vacío por construcción y ese vacío no significaría nada. Se verifica contra las publicaciones del órgano rector — hoy, a mano.
    deber: >-
      Convocar la Reunión Anual de Seguimiento y publicar el Informe Anual de Avance antes
      del 5 de abril.
    deudor: {tipo: organo, nombre: Órgano rector (hoy MHE, art. 41 lo asignaba al MEPyD)}
    periodicidad: anual
    plazo: {tipo: fecha_anual, vence: "04-05"}
    consecuencia: null
    estado: cumplida
    evidencia: "13 informes anuales publicados; el 13.º en abril de 2026 con datos al cierre de 2024."
    produce: [informe_anual_de_avance]

  - id: art-42-informe-mediano-plazo
    articulo: 42
    sin_consulta_normativa: >-
      Igual que el 41: el deber produce un INFORME, no una norma. Y acá la distinción importa más que en ningún otro, porque este es el único `incumplida` del expediente: se sostiene en que no existe ningún Informe de Mediano Plazo en catorce años, no en un vacío del corpus normativo. Atarlo a JurisAI daría un vacío concluyente sobre el universo equivocado y volvería refutable una acusación que hoy es sólida.
    deber: >-
      Elaborar el Informe de Mediano Plazo en julio del último año de cada período de
      gobierno, SOBRE LA BASE DE ESTUDIOS INDEPENDIENTES coordinados con el CES.
    deudor: {tipo: organo, nombre: Órgano rector con el CES}
    periodicidad: cuatrienal
    plazo: {tipo: fechas, vence: ["2016-07-31", "2020-07-31", "2024-07-31", "2028-07-31"]}
    consecuencia: null
    estado: incumplida
    evidencia: >-
      Ningún Informe de Mediano Plazo publicado en catorce años de vigencia. El contraste con
      los 13 informes anuales del art. 41 es el hallazgo: trece cumplimientos de la obligación
      de REPORTAR, cero de la obligación de REVISAR. Reportar se hace con personal propio;
      revisar exige contratar evaluación externa.
    produce: [estudios_independientes, informe_mediano_plazo]
    habilita_exigir: [requerimiento_al_organo_rector, amparo_de_cumplimiento]

  - id: art-44-revision-de-termino
    articulo: 44
    sin_consulta_normativa: >-
      CONVOCAR la Revisión de Término. No es una norma, y además no vence hasta el 2029-12-31: aunque hubiera fuente, no habría nada que juzgar todavía.
    deber: >-
      Convocar la Revisión de Término un año antes del vencimiento, sobre estudios
      independientes, para acordar el curso de acción hacia una nueva Estrategia.
    deudor: {tipo: organo, nombre: Órgano rector con el CES}
    plazo: {tipo: fecha_cierta, vence: "2029-12-31"}
    consecuencia: null
    estado: pendiente_no_vencida
    evidencia: >-
      Vence en 2029 y no consta preparación pública. Es la disposición más relevante del
      expediente: la sucesión de la END no hay que inventarla, está mandada por la propia ley
      con fecha — y nadie la está preparando.
    produce: [estudios_independientes, revision_de_termino]
    habilita_exigir: [calendarizacion_formal]

  - id: art-50-informe-de-vinculacion
    articulo: 50
    sin_consulta_normativa: >-
      REMITIR un informe junto al Proyecto de Presupuesto. El acto NO llega a la Gaceta —el emisor de la base normativa lo declaró fuera de su alcance— y por eso no hay consulta normativa.
      Se comprueba contra el expediente presupuestario del Congreso: ver `verificacion_congresual`.
    verificacion_congresual:
      # Quién lleva el registro decide el grado de independencia. Acá es TERCERO: el obligado
      # es el Ejecutivo y el expediente lo lleva la Cámara.
      registro_de: Cámara de Diputados
      buscar: proyectos de Presupuesto General del Estado remitidos por el Poder Ejecutivo
      en: documentos del expediente de cada proyecto
      nota: >-
        El deber depende del CONTENIDO del informe y el contenido no se puede leer: los PDF
        viven en un host con certificado autofirmado. El veredicto máximo por esta vía es
        `solo_registral`.
    deber: >-
      Remitir, con cada Proyecto de Presupuesto, un informe que sustente su vinculación con
      las metas de la END.
    deudor: {tipo: organo, nombre: Poder Ejecutivo}
    periodicidad: anual
    consecuencia: null
    estado: sin_registro_publico
    evidencia: >-
      ══ CORREGIDO 2026-08-20, contra el registro del Congreso ══ La redacción anterior decía
      que «no se localizó registro público de escrutinio de estos informes», y eso ya es falso:
      el escrutinio consta —cada Proyecto de Presupuesto trae el informe de una comisión
      bicameral—. Lo que no consta es un documento cuyo TÍTULO nombre la vinculación con la
      Estrategia, en ninguno de los dos ciclos que el registro sirve (PGE 2025 y PGE 2026).
      Sigue sin afirmarse incumplimiento, y ahora por dos motivos concretos: el informe pudo
      depositarse dentro del «INFORME EXPLICATIVO Y MARCO DE GASTO», cuyo contenido no se
      puede leer, y el registro solo sirve el período legislativo vigente — no los años en que
      esta obligación anual venció.
    habilita_exigir: [requerimiento_de_la_comision_bicameral]

  - id: art-51-comision-bicameral
    articulo: 51
    sin_consulta_normativa: >-
      CONSTITUIR la Comisión Bicameral. Un acto del propio Congreso, que consta en sus expedientes y no en la Gaceta, así que no hay consulta normativa que hacer.
      Se comprueba contra el registro legislativo: ver `verificacion_congresual`.
    verificacion_congresual:
      # Acá el registro lo lleva el PROPIO OBLIGADO. Es mejor que su palabra —un acto deja
      # rastro— y no es evidencia de tercero, y el informe tiene que decirlo.
      registro_de: Congreso Nacional
      buscar: comisiones bicamerales permanentes
      control_positivo: comisiones bicamerales especiales
      en: catálogo de comisiones y documentos del expediente presupuestario
      nota: >-
        El listado por tipo sirve SOLO el período legislativo vigente y el registro no declara
        su cobertura, así que ningún vacío suyo autoriza a afirmar que la comisión nunca se
        constituyó. La búsqueda por palabra clave del propio registro devuelve cero para
        «bicameral» mientras el listado por tipo devuelve cinco: por eso toda consulta lleva
        control positivo.
    deber: >-
      Constituir la Comisión Bicameral de Planificación y Presupuesto para verificar y
      efectuar seguimiento sistemático de la vinculación entre las metas de la END y el
      Presupuesto, con facultad de citar ministros.
    deudor: {tipo: organo, nombre: Congreso Nacional}
    consecuencia: null
    # DECISIÓN DEL DUEÑO (2026-08-21): promovido de `sin_registro_publico` a `parcial` con la
    # evidencia del propio archivo del Congreso. `parcial` es ACUSATORIO y el motor exige
    # evidencia para admitirlo — la trae, y son siete documentos suyos.
    estado: parcial
    evidencia: >-
      ══ CORREGIDO 2026-08-20, contra el registro del Congreso ══ La afirmación anterior —«no
      se localizó registro público de actividad de fiscalización»— era REFUTABLE con el propio
      archivo del Congreso, que es exactamente lo que la nota advertía. Una comisión bicameral
      SÍ examina el Presupuesto: los expedientes del PGE 2025 y del PGE 2026 registran siete
      documentos suyos, entre ellos «INFORME COMISIÓN BICAMERAL» y «DESIGNACIÓN COMISIÓN
      BICAMERAL DEL SENADO».
      Lo que no consta es una comisión bicameral PERMANENTE: la categoría existe en el
      catálogo del propio Congreso y está vacía, y las bicamerales que aparecen se designan
      por proyecto. El artículo 51 pide permanencia y seguimiento sistemático, así que el
      hallazgo es esa diferencia y no una ausencia de fiscalización.
      Alcance que viaja con la afirmación: el registro sirve solo el período legislativo
      vigente y no declara su cobertura.
    habilita_exigir: [citacion_de_funcionarios, requerimiento_del_informe_art_50]

  - id: art-54-reglamento
    articulo: 54
    deber: Dictar el Reglamento de aplicación dentro de los 180 días de la promulgación.
    deudor: {tipo: organo, nombre: Poder Ejecutivo}
    plazo: {tipo: fecha_cierta, vence: "2012-07-23", base: 180 días desde el 2012-01-25}
    # Qué buscar para comprobarlo. El rango arranca en la promulgación de la ley y llega
    # hasta hoy: si se cortara en el vencimiento, un cumplimiento TARDÍO —que es justo lo
    # que pasó— se leería como incumplimiento.
    verificacion_normativa:
      cita_a: "ley:1-12"
      tipo: decreto
      desde: "2012-01-25"
      # El rango llega hasta HOY y no hasta el vencimiento: cortarlo en el plazo haría leer
      # como incumplimiento justamente el cumplimiento tardío que ocurrió.
      hasta: "2026-12-31"
      # `vence` se le pasa al EMISOR además de usarse acá para juzgar. No es redundante: con
      # él, el API computa la holgura y marca `veredicto_sensible_a_publicacion` cuando el
      # dictado cae al filo del plazo y no consta fecha de Gaceta. Sin pasarlo, ese aviso no
      # llega y publicaríamos un veredicto firme sobre una diferencia que no medimos.
      vence: "2012-07-23"
    consecuencia: null
    estado: cumplida_tarde
    evidencia: >-
      Decreto 134-14 del 9 de abril de 2014: 21 meses después del vencimiento. Es el
      incumplimiento más limpio del expediente — plazo expreso, fecha cierta, incumplidor
      identificado, cero interpretación requerida.

  - id: art-36-pacto-fiscal
    articulo: 36
    sin_consulta_normativa: >-
      El artículo consigna la NECESIDAD de concertar un Pacto Fiscal, no un deber con plazo, y por eso su estado es `no_exigible`. No es que falte la fuente: no hay obligación que verificar. Si el pacto se concertara y tomara forma normativa, eso sería un hecho NUEVO y no el cumplimiento de un deber que la ley no impuso.
    deber: >-
      Concertar un Pacto Fiscal. El artículo consigna la NECESIDAD de que las fuerzas
      políticas, económicas y sociales arriben al pacto.
    deudor: {tipo: indeterminado, nombre: "las fuerzas políticas, económicas y sociales"}
    consecuencia: null
    estado: no_exigible
    evidencia: >-
      Catorce años y medio sin convocatoria, sin decreto y con un repositorio oficial en el
      CES que contiene un solo archivo en toda su historia. Pero el artículo NO fija plazo
      para firmar: su párrafo da tres años para el proceso que el pacto debía iniciar, lo que
      es una condición suspensiva sin término. Es incorrecto hablar de «retraso» o de que «el
      plazo venció en 2015».
    nota_de_diseño: >-
      Una obligación cuyo sujeto pasivo es «las fuerzas políticas, económicas y sociales» es
      inexigible POR CONSTRUCCIÓN: no hay a quién requerir, quién incurre en mora, ni qué
      efecto produce el vencimiento. Es falla de diseño de la ley, es textual, y se sostiene
      sin analogías.
