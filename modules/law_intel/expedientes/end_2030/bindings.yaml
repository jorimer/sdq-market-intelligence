  # ══════════════════════════════════════════════════════════════════════════════════════
  # PEFA (3.1 a 3.8) — el instrumento que la ley eligió fue REEMPLAZADO
  #
  # No es una brecha nuestra ni una fuente que no encontramos. Es un hallazgo del informe, y
  # el mejor documentado del expediente: lo dice el evaluador contratado por el propio Estado
  # dominicano, en un anexo encargado EXACTAMENTE para responder esta pregunta.
  #
  # Los Términos de Referencia del PEFA República Dominicana 2016 pidieron «una recomendación
  # sobre cómo continuar monitoreando los indicadores PEFA incluidos en la Estrategia Nacional
  # de Desarrollo (END 2030)». El anexo nombra los ocho, que son exactamente estos.
  #
  # Su conclusión, textual:
  #
  #   «estas dos versiones de la metodología PEFA no son estrictamente comparables y, por lo
  #    tanto, hacer el seguimiento de los progresos en los sistemas GFP utilizando ambas
  #    versiones —una contra la otra— no es posible sin incorporar información adicional. Es
  #    por esta razón que se aconseja utilizar la metodología PEFA 2016 SÓLO PARA ESTABLECER
  #    UNA NUEVA LÍNEA DE BASE.»
  #
  #   «los puntajes de los indicadores a futuro no serán comparables con los que hasta ahora
  #    se han estado utilizando.»
  #
  # De 94 dimensiones del marco 2016, solo 14 son «directamente comparables» con el anterior.
  #
  # ── LA TRAMPA QUE ESTO HABRÍA TENDIDO ──
  # El marco 2016 REUTILIZA los mismos códigos `ID-n` con OTRO significado. Atar por código
  # habría publicado un veredicto sobre el indicador equivocado, sin que nada avisara:
  #
  #     código   lo que pide la ley (2011)      lo que mide el informe 2016
  #     ID-19    adquisiciones                  administración de ingresos
  #     ID-21    auditoría interna              previsibilidad de recursos
  #     ID-24    informes presupuestarios       adquisiciones
  #     ID-27    escrutinio del presupuesto     integridad de datos financieros
  #
  # Y acá la sonda NO habría salvado: la línea base es ordinal (D, B, D+), no hay delta
  # porcentual que computar. El filtro barato no aplica y la única defensa es leer la fuente.
  #
  # Evaluaciones PEFA de República Dominicana: 2007 (línea base de la ley), 2010, 2012 —marco
  # anterior— y 2016 y 2022 —marco nuevo—. Las tres primeras son comparables con la ley y
  # ninguna alcanza los cortes de 2020, 2025 ni 2030.
  # ══════════════════════════════════════════════════════════════════════════════════════

