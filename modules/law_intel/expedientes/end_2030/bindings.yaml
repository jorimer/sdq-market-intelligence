# BINDINGS — qué variable viva mide cada indicador de la ley.
#
# **Un binding se declara, nunca se infiere.** El nombre de un indicador parecido al de una
# variable no es evidencia de que midan lo mismo: `presión tributaria` (solo ingresos
# tributarios) y `presión fiscal` (incluye no tributarios y donaciones) difieren en más de un
# punto del PIB, y confundirlas invierte la lectura del cumplimiento.
#
# **`estado` es lo que hace honesta la cobertura de portada:**
#
#   verificado  la variable existe, devuelve dato y se contrastó contra la fuente. CUENTA.
#   propuesto   la variable es plausible y todavía no se comprobó. NO cuenta.
#   descartado  se evaluó y NO mide lo que el eje afirma medir. NO cuenta, y dice por qué.
#
# **El código es `<eje>:<variable>` del Data Registry**, no un código de tabla. La primera
# versión inventó códigos por dominio (`one.pobreza.extrema_nacional_pct`) sin mirar el
# catálogo: los siete dieron `vacia` al verificarlos en producción. El eje va adelante porque
# las claves no son únicas entre ejes.
#
# **`mejor` debe coincidir con la dirección que se computa de las propias metas de la ley.**
# Si no coinciden, el expediente no carga.

version: "2.0"

bindings:
  # ── Pobreza: la variable del panel social mide la incidencia NACIONAL ──
  - indicador: "2.1"
    serie: "social_dev:poverty_rate"
    fuente: one
    mejor: menor
    estado: propuesto
    nota_comparabilidad: >-
      ⚠️ Verificar ANTES de promover: el indicador 2.1 es pobreza EXTREMA y `poverty_rate` del
      panel social puede ser pobreza monetaria general — son dos líneas distintas y la meta
      legal (3,5% en 2025) corresponde a la primera. Si la variable resulta ser la general, el
      binding correcto es el del indicador 2.4 y este queda sin fuente.
      Además, la línea base de 2010 viene de la ENFT y la medición actual de la ENCFT/ENGIH,
      con metodología actualizada en 2022: las metas nunca se re-expresaron tras el cambio.

  - indicador: "2.4"
    serie: "social_dev:poverty_rate"
    fuente: one
    mejor: menor
    estado: propuesto
    nota_comparabilidad: >-
      Pobreza monetaria general. Ver la advertencia de 2.1: las dos no pueden apuntar a la
      misma variable, y cuál corresponde se decide comprobando qué mide `poverty_rate`.

  - indicador: "2.19"
    serie: "social_dev:literacy_rate"
    fuente: one
    mejor: menor            # el indicador mide ANALFABETISMO: menos es mejor
    estado: propuesto
    nota_comparabilidad: >-
      ⚠️ La variable del panel es tasa de ALFABETIZACIÓN y el indicador legal es su
      complemento (analfabetismo). Requiere la transformación 100 − x, que hoy el binding NO
      declara: promoverlo sin resolverlo publicaría el valor invertido. Y la meta de la ley es
      un UMBRAL («< 4%»), así que el indicador no admite delta de todos modos.

  - indicador: "2.18"
    serie: "social_dev:schooling_years"
    fuente: one
    mejor: mayor
    estado: propuesto

  - indicador: "2.21"
    serie: "social_dev:life_expectancy"
    fuente: one
    mejor: mayor
    estado: propuesto

  - indicador: "3.13"
    serie: "telecom:internet_penetration"
    fuente: one
    mejor: mayor
    estado: propuesto
    nota_comparabilidad: >-
      El indicador legal se expresa como usuarios por cada 100 habitantes; verificar que la
      variable del panel de telecom use la misma base y no hogares.

  - indicador: "3.26"
    serie: "social_dev:income_per_capita"
    fuente: one
    mejor: mayor
    estado: propuesto
    nota_comparabilidad: >-
      ⚠️ El indicador legal es Ingreso Nacional Bruto per cápita en dólares internacionales
      corrientes por método Atlas (línea base 4.460 en 2008). La variable del panel social es
      ingreso per cápita por región y probablemente esté en pesos y por otra metodología. Si
      no coinciden, esto se descarta: no es la misma magnitud.

  - indicador: "4.1"
    serie: "esg:carbon_intensity"
    fuente: one
    mejor: menor
    estado: propuesto
    nota_comparabilidad: >-
      El indicador legal son toneladas métricas de CO₂ per cápita (3,6 en 2010). Verificar que
      `carbon_intensity` no sea intensidad por unidad de PIB, que es otra magnitud.

  # ── Descartado con su motivo, para que quede el rastro de lo evaluado ──
  - indicador: "3.9"
    serie: "wef.indice_global_competitividad.rd"
    fuente: pefa
    mejor: mayor
    estado: descartado
    motivo_descarte: >-
      El WEF discontinuó el Índice Global de Competitividad en su forma comparable tras 2019 y
      no es fuente oficial del Estado dominicano. Sin fuente admisible, el indicador queda
      declarado sin medición: es una brecha del instrumento, no del sistema.
