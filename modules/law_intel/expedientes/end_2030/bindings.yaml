# ── 3.24 · DESCARTE CON EVIDENCIA ─────────────────────────────────────────────────────────
  - indicador: "3.24"
    serie: "wdi.FS.AST.PRVT.GD.ZS"
    fuente: wdi
    mejor: mayor
    estado: descartado
    origen: estimacion_de_tercero_sobre_dato_del_evaluado
    productor: Banco Mundial sobre estadísticas monetarias del BCRD.
    motivo_descarte: >-
      Ninguno de los tres agregados de crédito del republicador mide «crédito a la
      producción». Contra la ventana 2005-2010 que la ley promedia, con la base legal en
      2,24% del PIB: crédito interno al sector privado da 20,68% (Δ 823%), crédito de bancos
      al sector privado 19,83% (Δ 785%) y crédito interno total 36,88% (Δ 1.546%).
      LA FUENTE QUE ESTE MOTIVO PEDÍA YA SE PROBÓ, el 2026-08-22, y tampoco cierra. Se trajo
      el cuadro de préstamos por destino económico del banco central —mensual desde 1996, con
      trece destinos— y se computó cada destino como stock de diciembre sobre el PIB nominal,
      convención declarada antes de mirar el resultado y la misma del 2.36. Ningún
      agrupamiento defendible se acerca: agricultura sola da 4,38%, agricultura más minas más
      manufactura 4,97%, y los cinco sectores productivos juntos 11,23%. Todos los destinos
      productivos por separado superan el 2,24% salvo minas (0,15%) y electricidad (0,55%).
      Y hay un argumento que no depende de elegir bien el agrupamiento: si el universo de la
      ley fuera cualquier agregado de crédito bancario a la producción, la meta de 8% para
      2015 ya estaría cumplida en la línea base, lo que vuelve incoherente la trayectoria que
      la propia ley fija (2,24 en la base y 30 para 2030).
      NO se eligió por cercanía. Un barrido combinatorio sobre los trece destinos sí encuentra
      coincidencias —minas más electricidad más servicios comunitarios da 2,31%, Δ 3,3%— y
      ninguna significa nada: con trece sumandos siempre hay una combinación cerca de
      cualquier número. Publicar una sería abrir exactamente la puerta que el oráculo cierra.
    hipotesis_sin_comprobar: >-
      Que «producción» nombre un universo mucho más angosto que el crédito bancario: crédito
      de la banca pública de desarrollo, o crédito a tasa preferencial, o un programa
      concreto. Lo sugiere que la base de la ley esté por debajo de CADA destino productivo
      del sistema bancario menos dos. No está comprobado y exige identificar primero qué
      institución publica ese universo.

