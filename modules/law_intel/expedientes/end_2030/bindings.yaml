      observar y por eso no se cuenta ni a favor ni en contra.
      Lo que ese cálculo supone, y hay que decirlo: que la razón entre añadas se mantiene
      constante entre años. No está medido, y es la razón por la que la salvedad se imprime
      en vez de darse por saldada.
      CORRECCIÓN DE UN DEFECTO PROPIO, 2026-08-23: este binding apuntaba a `ied_usd_mm`, sin
      el prefijo de eje que el proveedor exige y —peor— a la serie que el emisor publica POR
