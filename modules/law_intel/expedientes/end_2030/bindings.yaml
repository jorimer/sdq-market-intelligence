# BINDINGS — qué variable viva mide cada indicador de la ley.
#
# **Un binding se declara, nunca se infiere.** El nombre de un indicador parecido al de una
# variable no es evidencia de que midan lo mismo.
#
#   verificado  la variable existe, devuelve dato y se contrastó QUÉ MIDE. CUENTA.
#   propuesto   plausible, sin comprobar. NO cuenta.
#   descartado  se evaluó y NO mide lo que el eje afirma. NO cuenta, y dice por qué.
#
# **Que la serie exista no basta para promover.** Mientras haya una `nota_comparabilidad`
# abierta el binding no promueve, por más dato reciente que devuelva: el 2.19 existía, traía
# 2024 y medía la magnitud contraria.
#
# El código es `<eje>:<variable>` del Data Registry. Las claves no son únicas entre ejes.

version: "5.0"

# ── PROMOCIÓN 2026-08-16 ──────────────────────────────────────────────────────────────────
# Cuatro bindings pasan de `propuesto` a `verificado` porque la comprobación contra las
# series reales de producción los dio verificables Y sin duda de comparabilidad abierta:
#
#   2.4   social_dev:poverty_rate      15,0    (2024) · «Pobreza monetaria general»
#   2.18  social_dev:schooling_years    9,63   (2024)
#   2.19  social_dev:literacy_rate      6,3    (2024) tras `complemento_100`
#   2.21  social_dev:life_expectancy   73,868  (2024)
#
# ── PROMOCIÓN 2026-08-16 ──────────────────────────────────────────────────────────────────
#   2.1   social_dev:poverty_extreme    2,0    (2024) · «Pobreza monetaria extrema»
#
# Este no esperaba dato del Estado: esperaba que NOSOTROS expusiéramos como señal un tema que
# ya estaba ingerido (PR #748). La brecha era de superficie y estaba de nuestro lado.
#
# La promoción se escribe acá y no la hace la verificación: el estado de un binding es un
# hecho comiteado y auditable contra el repositorio. Si la cobertura pudiera subir en
# caliente, la cifra de portada dejaría de ser verificable.
#
# Cobertura del expediente: 5 de 90 indicadores numerados.

bindings:
  # ══ RESUELTO ══ `poverty_rate` es «Pobreza monetaria GENERAL» (15,0 en 2024), no extrema.
  # Corresponde al indicador 2.4 (pobreza moderada), no al 2.1.
  - indicador: "2.4"
    serie: "social_dev:poverty_rate"
    fuente: one
    mejor: menor
    estado: verificado
    nota_comparabilidad: null
    nota: >-
      Comprobado contra `_THEME_LABELS` del panel social: «Pobreza monetaria general». La
      línea base legal de 2010 (33,8%) viene de la ENFT y la medición actual de la
      ENCFT/ENGIH, con metodología actualizada en 2022; las metas nunca se re-expresaron tras
      el cambio. Es una salvedad a declarar en el informe, no un impedimento para medir.

  # ══ RESUELTO ══ El indicador es ANALFABETISMO y la variable es alfabetización.
  # La transformación se declara; sin ella el binding publicaría el complemento.
  - indicador: "2.19"
    serie: "social_dev:literacy_rate"
    fuente: one
    mejor: menor
    transformacion: complemento_100
    estado: verificado
    nota_comparabilidad: null
    nota: >-
      «Tasa de alfabetización» = 93,7% en 2024 → analfabetismo 6,3%. La meta legal es un
      UMBRAL («< 4%»), así que el indicador no admite delta: se cumple o no se cumple, y con
      6,3% no se cumple.

  - indicador: "2.18"
    serie: "social_dev:schooling_years"
    fuente: one
    mejor: mayor
    estado: verificado

  - indicador: "2.21"
    serie: "social_dev:life_expectancy"
    fuente: one
    mejor: mayor
    estado: verificado

  # ══ SEÑAL YA EXPUESTA QUE NINGÚN BINDING RECLAMABA ══
  # No hizo falta conectar nada: `secondary_coverage` (MINERD) estaba en el Data Registry
  # desde antes, sirviendo al índice de desarrollo, y nadie la había cruzado contra la ley.
  - indicador: "2.10"
    serie: "social_dev:secondary_coverage"
    fuente: minerd
    mejor: mayor
    estado: propuesto
    nota: >-
      «Cobertura neta secundaria» contra «Tasa neta de cobertura educación nivel secundaria»:
      misma magnitud, misma unidad, mismo productor (MINERD). Queda `propuesto` hasta
      comprobar contra producción que la serie devuelve dato; el estado lo decide la
      verificación, no esta edición.

  # ══ SEÑAL YA EXPUESTA, PERO EL INDICADOR MIDE LO CONTRARIO ══
  # El indicador legal cuenta el sector FORMAL y la variable mide la INFORMALIDAD. Es el
  # mismo caso del 2.19 (analfabetismo vs alfabetización): sin declarar la transformación,
  # el binding publicaría el complemento y la dirección quedaría invertida.
  - indicador: "2.39"
    serie: "social_dev:informality_rate"
    fuente: bcrd
    mejor: mayor
    transformacion: complemento_100
    estado: propuesto
    nota: >-
      `informality_rate` es «% de población ocupada en el sector informal» (BCRD/ENCFT). El
      indicador legal es su complemento: «% de población ocupada en el sector FORMAL (15 años
      y más)», con línea base 43,7% en 2010 y metas crecientes hasta 60% en 2030. Con la
      transformación aplicada la lectura queda en torno a 44-45%, es decir prácticamente en
      la línea base catorce años después. Si la verificación lo confirma, es uno de los
      hallazgos más duros del expediente y hay que sostenerlo con la definición exacta de
      informalidad que usa la ENCFT, que no tiene por qué ser la que tenía la ENFT en 2010.

  # ══ DESCARTADO ══ No es la misma magnitud, y la diferencia no la arregla ninguna
  # transformación declarable: son conceptos distintos.
  - indicador: "2.22"
    serie: "social_dev:child_mortality"
    fuente: one
    mejor: menor
    estado: descartado
    motivo_descarte: >-
      La variable del panel viene del código `SP.DYN.IMRT.IN` del Banco Mundial, que es
      mortalidad INFANTIL (menores de 1 año), y el indicador legal es mortalidad de menores
      de 5 AÑOS. Son dos magnitudes distintas y ninguna transformación las convierte: la de
      menores de 5 incluye a la infantil más las muertes entre 1 y 4 años. El nombre de la
      variable (`child_mortality`) invita al error y el valor (27,7) es plausible para las
      dos, que es exactamente lo que vuelve peligrosa la confusión.


  - indicador: "3.26"
    serie: "social_dev:income_per_capita"
    fuente: one
    mejor: mayor
    estado: descartado
    motivo_descarte: >-
      La variable del panel es «Ingreso familiar MENSUAL por persona» (SISDOM/MEPyD, en pesos,
      19.607 en 2024). El indicador legal es Ingreso Nacional Bruto per cápita ANUAL en
      dólares por método Atlas (línea base 4.460 en 2008, meta 2030 de 12.454). Distinta
      unidad, distinta periodicidad y distinto concepto — ingreso de hogares contra ingreso
      nacional. Atarlos produciría una comparación sin significado.

  - indicador: "3.9"
    serie: "wef.indice_global_competitividad.rd"
    fuente: pefa
    mejor: mayor
    estado: descartado
    motivo_descarte: >-
      El WEF discontinuó el Índice Global de Competitividad en su forma comparable tras 2019 y
      no es fuente oficial del Estado dominicano. Sin fuente admisible, el indicador queda
      declarado sin medición: es una brecha del instrumento, no del sistema.

  # ══ BRECHA NUESTRA, CERRADA (PR #748) ══
  # El tema `poverty_extreme` existía en el panel social y no se exponía como señal del Data
  # Registry por no alimentar el índice de desarrollo: la verificación no lo alcanzaba. No era
  # una brecha del Estado ni una duda sobre qué mide — era de superficie, nuestra, y se cerró
  # exponiendo el tema. Verificado en prod el 2026-08-16: 2,0% en 2024.
  - indicador: "2.1"
    serie: "social_dev:poverty_extreme"
    fuente: one
    mejor: menor
    estado: verificado
    nota_comparabilidad: null
    nota: >-
      2,0% en 2024 contra una meta de 3,5% para 2025 y de 2,0% para 2030: el indicador alcanzó
      la meta del horizonte completo seis años antes. Es el hallazgo más fuerte del expediente
      y por eso mismo el que más exige declarar su salvedad: la línea base legal de 2010
      (10,1%) viene de la ENFT y la medición actual de la ENCFT/ENGIH, con la metodología de
      pobreza monetaria actualizada en 2022 y las metas nunca re-expresadas tras el cambio.
      La magnitud de la mejora no se explica solo por el cambio de metodología, pero atribuirla
      entera a la política sin declarar el corte sería exactamente el defecto que este
      instrumento denuncia.

      La duda que quedaba abierta era si el sync trae filas —la ONE está tras Cloudflare y
      desde fuera no se podía afirmar—. Se respondió contra producción, no a mano:
      `/bindings/verificacion` devolvió `promueve: true` con período 2024.
