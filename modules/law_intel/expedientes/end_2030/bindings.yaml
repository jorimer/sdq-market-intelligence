# BINDINGS — qué variable viva mide cada indicador de la ley.
#
# **Un binding se declara, nunca se infiere.** El nombre de un indicador parecido al de una
# variable no es evidencia de que midan lo mismo.
#
#   verificado  la variable existe, devuelve dato y se contrastó QUÉ MIDE. CUENTA.
#   propuesto   plausible, sin comprobar. NO cuenta.
#   descartado  se evaluó y NO mide lo que el eje afirma. NO cuenta, y dice por qué.
#
# **Que la serie exista no basta para promover.** Mientras haya una `nota_comparabilidad`
# abierta el binding no promueve, por más dato reciente que devuelva: el 2.19 existía, traía
# 2024 y medía la magnitud contraria.
#
# El código es `<eje>:<variable>` del Data Registry. Las claves no son únicas entre ejes.

version: "21.0"

# ── PROMOCIÓN 2026-08-16 ──────────────────────────────────────────────────────────────────
# Cuatro bindings pasan de `propuesto` a `verificado` porque la comprobación contra las
# series reales de producción los dio verificables Y sin duda de comparabilidad abierta:
#
#   2.4   social_dev:poverty_rate      15,0    (2024) · «Pobreza monetaria general»
#   2.18  social_dev:schooling_years    9,63   (2024)
#   2.19  social_dev:literacy_rate      6,3    (2024) tras `complemento_100`
#   2.21  social_dev:life_expectancy   73,868  (2024)
#
# ── PROMOCIÓN 2026-08-16 ──────────────────────────────────────────────────────────────────
#   2.1   social_dev:poverty_extreme    2,0    (2024) · «Pobreza monetaria extrema»
#
# Este no esperaba dato del Estado: esperaba que NOSOTROS expusiéramos como señal un tema que
# ya estaba ingerido (PR #748). La brecha era de superficie y estaba de nuestro lado.
#
# La promoción se escribe acá y no la hace la verificación: el estado de un binding es un
# hecho comiteado y auditable contra el repositorio. Si la cobertura pudiera subir en
# caliente, la cifra de portada dejaría de ser verificable.
#
# Cobertura del expediente: 12 de 90 indicadores numerados, todos contra cifra de PAÍS:
#   2.9   cobertura básica (MINERD, TOTAL PAIS) — verificado 2026-08-18
#   2.10  cobertura secundaria (MINERD, TOTAL PAIS) — verificado 2026-08-18
#   2.45  síndicas (CEPAL OIG) — verificado 2026-08-18
#   2.46  regidoras (CEPAL OIG) — verificado 2026-08-18
#   2.22  mortalidad de menores de 5 (WDI · UN IGME) — verificado 2026-08-18
#   2.44  mujeres en Diputados (WDI · UIP) — verificado 2026-08-17
#   3.13  usuarios de internet (WDI, republica UIT) — verificado 2026-08-17
#   2.18  escolaridad promedio (SISDOM, fila «Total») — recuperado 2026-08-17
#   2.21  esperanza de vida (WDI, país)
#   2.39  ocupados en sector formal (BCRD/ENCFT, país)
#   2.41  razón de ocupación F/M (BCRD/ENCFT, país)
#   2.42  razón de desocupación F/M (BCRD/ENCFT, país)
#
# ── RECUPERACIÓN 2026-08-17 ───────────────────────────────────────────────────────────────
# 2.18 vuelve a `verificado` apuntando a la cifra NACIONAL: la fila «Total» del cuadro
# 05 3 007 del SISDOM, que el parser salteaba por no resolver a ninguna región. 9,59 años en
# 2024 — la de cibao_norte, que se venía publicando, era 9,63.
#
# 2.9 (nuevo) y 2.10 apuntan al `TOTAL PAIS` del tablero del SIIE y esperan a que la fuente
# responda: da 400 por límite de tasa, también desde producción.
#
# ── DEMOCIÓN 2026-08-16 ─────────────────────────────────────────────────────────
# 2.1, 2.4, 2.10, 2.18 y 2.19 bajan de `verificado` a `propuesto`. Sus variables se
# miden POR REGIÓN y el registro publica el valor de la primera del panel, no el
# del país: se estuvo contrastando la cifra de `cibao_norte` contra una meta
# nacional. Lo destapó revisar `pattern_a_signals`, cuyo campo se llama
# `sample_value` por dentro y `value` por fuera.
#
# Sobreviven las que miden el país de verdad: 2.21 (WDI), 2.39, 2.41 y 2.42 (BCRD).

bindings:
  # ══ RESUELTO ══ `poverty_rate` es «Pobreza monetaria GENERAL» (15,0 en 2024), no extrema.
  # Corresponde al indicador 2.4 (pobreza moderada), no al 2.1.
  - indicador: "2.4"
    serie: "social_dev:poverty_rate_national"
    fuente: mhe
    mejor: menor
    estado: propuesto
    origen: declarado_por_el_evaluado
    productor: >-
      SISDOM (MHE) — cuadro 03 3 003a, zona NACIONAL, línea de pobreza monetaria.
    nota_comparabilidad: >-
      ══ MEDIDO 2026-08-22 ══ Resuelto el defecto que lo había demotado —se contrastaba una
      serie regional contra una meta nacional— y sigue sin cerrar, por la MISMA razón que su
      hermano rural, el 2.6: la ley dice «pobreza moderada» y el emisor publica «pobreza
      monetaria», que es la línea TOTAL e incluye la indigencia.
      Las dos lecturas contra la base legal de 33,8 para 2010: la total da 40,53 (Δ 19,9%) y
      la total menos la indigencia da 29,74 (Δ 12,0%). Ninguna entra, y que las dos fallen en
      direcciones opuestas confirma que el corte del legislador no es ninguna de ellas.
      El quiebre de 2016 pesa más acá que en la línea de indigencia: el salto del año de
      solape es de 20,5% para la pobreza nacional contra 1,8% para la indigencia.
  - indicador: "2.19"
    serie: "social_dev:literacy_rate_pais"
    fuente: wdi
    mejor: menor
    transformacion: complemento_100
    periodo_verificado: "2024"
    estado: verificado
    origen: declarado_por_el_evaluado
    productor: >-
      Estado dominicano (ONE): censo y encuestas de hogares. El Banco Mundial republica el
      agregado; no mide.
    nota: >-
      ══ RE-ATADO 2026-08-19 ══ Cambia de FUENTE, no de concepto. Estaba demotado porque
      `social_dev:literacy_rate` se mide por región y el registro publicaba el valor de una
      sola demarcación contra una meta nacional; la serie del Banco Mundial es el AGREGADO
      del país, que es exactamente lo que faltaba.
      Comprobado contra la línea base de la propia ley ANTES de escribir el conector: la END
      fija 10,5% de analfabetismo para 2010 y la fuente da 89,54% de alfabetización ese año
      → complemento 10,46. Δ 0,4%.
      La nota de la democión queda abajo, porque explica por qué la fuente anterior no servía:
      ⚠️ DEMOTADO 2026-08-16. La variable se mide POR REGIÓN y el registro publica el
      valor de UNA de ellas (la primera del panel, `cibao_norte`), no el del país. El
      indicador de la ley fija una meta NACIONAL, así que el contraste no significaba
      nada — y el número que se publicó era el de una demarcación. No se arregla
      promediando las diez: sin ponderar por población eso tampoco es la cifra del país.
      El agregado nacional llegó, y es esta serie.
      Y sigue valiendo lo que ya estaba escrito sobre cómo se juzga: la meta legal es un
      UMBRAL («< 4%»), así que el indicador no admite delta — se cumple o no se cumple.
      Verificado en prod 2026-08-19: **5,97% de analfabetismo en 2024** tras el complemento, contra un umbral legal de «< 4%». Sigue sin cumplirse, pero ahora se mide con la cifra del país y no con la de una región.

  # ══ RECUPERADO ══ La cifra nacional estaba en el mismo cuadro que ya bajábamos.
  - indicador: "2.18"
    serie: "social_dev:schooling_years_pais"
    fuente: one
    mejor: mayor
    periodo_verificado: "2024"
    estado: verificado
    origen: declarado_por_el_evaluado
    productor: >-
      ONE — SISDOM, cuadro 05 3 007, fila «Total».
    nota: >-
      Repuntado de `social_dev:schooling_years` —que se mide POR REGIÓN y servía el valor
      de cibao_norte (9,63)— a `schooling_years_pais`, la fila «Total» del cuadro 05 3 007
      del SISDOM, que el parser salteaba por no resolver a ninguna región.
      Verificado en prod 2026-08-17: **9,59 años en 2024**, contra una línea base de 9,4 en
      2010 y una meta de 11,3 para 2025. Casi dos años por debajo de una meta ya vencida,
      con un avance de 0,19 años en catorce.

  - indicador: "2.21"
    serie: "social_dev:life_expectancy"
    fuente: wdi
    mejor: mayor
    periodo_verificado: "2024"
    estado: verificado
    origen: estimacion_de_tercero_sobre_dato_del_evaluado
    productor: >-
      División de Población de la ONU: estimación demográfica modelada sobre censos y
      estadísticas vitales dominicanas.
    nota: >-
      La fuente decía `one` y el dato viene del WDI (`SP.DYN.LE00.IN`), que es lo que el
      sync ingiere. Corregido: un rótulo de procedencia falso es peor que uno ausente,
      porque se cita.

  # ══ SEÑAL YA EXPUESTA QUE NINGÚN BINDING RECLAMABA ══
  # No hizo falta conectar nada: `secondary_coverage` (MINERD) estaba en el Data Registry
  # desde antes, sirviendo al índice de desarrollo, y nadie la había cruzado contra la ley.
  # Nivel BÁSICO del mismo tablero: el parser solo pedía secundaria.
  - indicador: "2.9"
    serie: "social_dev:primary_coverage_pais"
    fuente: minerd
    mejor: mayor
    periodo_verificado: "2025"
    estado: verificado
    origen: declarado_por_el_evaluado
    productor: >-
      MINERD — tablero del SIIE. Es el mismo órgano al que la ley le fija la meta.
    nota: >-
      Cobertura neta del nivel básico, fila `TOTAL PAIS` del tablero del SIIE. La meta es
      100% para 2025 desde una base de 94,7% en 2010, así que el margen es estrecho y el
      veredicto va a depender de décimas — razón de más para medirlo contra la cifra del
      país y no contra la de una región.
      Verificado en prod 2026-08-18: **92,81% en 2024**, contra una línea base de 94,7% en
      2010 y una meta de 100% para 2025. RETROCEDE: la cobertura del nivel básico es hoy
      casi dos puntos menor que cuando se fijó la meta, y era el indicador educativo que
      más cerca estaba de cumplirse.

  # ══ REPUNTADO a la serie nacional; espera a que la fuente responda ══
  - indicador: "2.10"
    serie: "social_dev:secondary_coverage_pais"
    fuente: minerd
    mejor: mayor
    periodo_verificado: "2025"
    estado: verificado
    origen: declarado_por_el_evaluado
    productor: >-
      MINERD — tablero del SIIE. Es el mismo órgano al que la ley le fija la meta.
    nota: >-
      Repuntado de `social_dev:secondary_coverage` —que se mide POR REGIÓN y servía el
      valor de cibao_norte (71,3)— a la fila `TOTAL PAIS` del tablero del SIIE.
      Queda `propuesto` por un motivo distinto al del resto: el tablero Power BI responde
      400 por límite de tasa, también desde producción, así que la señal nacional todavía
      no tiene dato. No es una duda sobre qué mide —eso está resuelto— sino que la fuente
      no contesta. La cura que el propio conector prescribe es una instantánea comiteada.
      Verificado en prod 2026-08-18: **71,61% en 2024**, contra una meta de 86% para 2025 y
      95% para 2030.
      El detalle que valida todo el arreglo del total país: la cifra NACIONAL es 71,61 y la
      de cibao_norte —que se venía publicando— era 71,3. Casi idénticas. Por eso el error
      original no se detectaba mirando el número.

  # ══ SEÑAL YA EXPUESTA, PERO EL INDICADOR MIDE LO CONTRARIO ══
  # El indicador legal cuenta el sector FORMAL y la variable mide la INFORMALIDAD. Es el
  # mismo caso del 2.19 (analfabetismo vs alfabetización): sin declarar la transformación,
  # el binding publicaría el complemento y la dirección quedaría invertida.
  - indicador: "2.39"
    serie: "social_dev:informality_rate"
    fuente: bcrd
    mejor: mayor
    transformacion: complemento_100
    periodo_verificado: "2024"
    estado: verificado
    origen: declarado_por_el_evaluado
    productor: >-
      BCRD — Encuesta Nacional Continua de Fuerza de Trabajo (ENCFT).
    nota: >-
      `informality_rate` es «% de población ocupada en el sector informal» (BCRD/ENCFT). El
      indicador legal es su complemento: «% de población ocupada en el sector FORMAL (15 años
      y más)», con línea base 43,7% en 2010 y metas crecientes hasta 60% en 2030.
      Verificado en prod 2026-08-16: **44,53% en 2024** contra 43,7% en 2010 — ocho décimas
      en catorce años, con una meta de 55% que venció en 2025. Es el hallazgo más duro del
      expediente hasta ahora, y por eso lleva su salvedad pegada: la definición de
      informalidad de la ENCFT no tiene por qué ser la que usaba la ENFT cuando se fijó la
      línea base, y el informe debe decirlo antes de atribuir el estancamiento a la política.

  # ══ MERCADO LABORAL (BCRD · ENCFT) ══
  # Los tres salen del mismo libro del BCRD, y NO tienen la misma calidad de evidencia.
  # La diferencia entre ellos es el hallazgo, no un detalle: un NIVEL no sobrevive al
  # cambio de encuesta y una RAZÓN sí.

  # ⚠️ El nivel NO es comparable con la meta. Queda `propuesto` a propósito.
  - indicador: "2.37"
    serie: "social_dev:unemployment_rate"
    fuente: bcrd
    mejor: menor
    estado: propuesto
    origen: declarado_por_el_evaluado
    productor: >-
      BCRD — ENCFT.
    nota_comparabilidad: >-
      La serie mide bien la desocupación, pero NO la misma que la ley usó para fijar sus
      metas. La línea base legal (14,3% en 2010) viene de la ENFT; la ENCFT, que la
      sustituyó, arranca en 7,33% en su primer año completo. El nivel se parte casi al
      medio en el momento exacto del cambio de encuesta, no de la política. Contrastar el
      5,14% de 2024 contra la meta de 7,0% para 2025 diría «meta superada con holgura»
      cuando lo que cambió fue la forma de medir. El Estado nunca re-expresó las metas
      sobre la encuesta nueva, y hasta que lo haga —o hasta que exista una serie
      retropolada— este indicador no es evaluable contra su meta. Es una brecha del
      INSTRUMENTO y de las más publicables: la recomendación es pedir la re-expresión.

  # La razón SÍ es comparable: el cambio de encuesta se cancela entre numerador y
  # denominador, porque las dos poblaciones se miden con la misma metodología.
  - indicador: "2.41"
    serie: "social_dev:employment_gender_ratio"
    fuente: bcrd
    mejor: mayor
    periodo_verificado: "2025"
    estado: verificado
    origen: declarado_por_el_evaluado
    productor: >-
      BCRD/ENCFT. El promedio anual es cómputo SDQ sobre los trimestres del emisor; la
      medición de base es del evaluado.
    nota: >-
      Razón entre la tasa de ocupación femenina y la masculina (1,0 = paridad). Computada
      sobre el promedio anual de cada sexo: el BCRD publica los trimestres, no el promedio,
      así que la media anual es cuenta nuestra y va declarada. Mejora sostenida —0,596 en
      2015 a 0,675 en 2025— contra una meta de 0,85 para 2025 desde una base de 0,55 en
      2010: avanzó un tercio de lo que la ley pedía.

  - indicador: "2.42"
    serie: "social_dev:unemployment_gender_ratio"
    fuente: bcrd
    mejor: menor
    periodo_verificado: "2025"
    estado: verificado
    origen: declarado_por_el_evaluado
    productor: >-
      BCRD/ENCFT. El promedio anual es cómputo SDQ sobre los trimestres del emisor; la
      medición de base es del evaluado.
    nota: >-
      Razón entre la desocupación femenina y la masculina; la ley manda cerrarla hacia 1,0.
      Va en el sentido contrario: 2,18 en 2010 (base legal), 2,01 en 2015 y 2,70 en 2025,
      contra una meta de 1,25 para 2025. La brecha es HOY más ancha que cuando se fijó la
      meta. Es el único indicador del expediente que retrocede contra su línea base, y a
      diferencia del 2.37 la lectura no se explica por el cambio de encuesta: una razón
      entre dos poblaciones medidas con la misma metodología es robusta a ese cambio.

  # ══ LA FUENTE QUE LO PRODUCE DEJÓ DE SER ALCANZABLE; SE TOMA DE QUIEN LA REPUBLICA ══
  - indicador: "3.13"
    serie: "social_dev:internet_users"
    fuente: wdi
    mejor: mayor
    periodo_verificado: "2024"
    estado: verificado
    origen: declarado_por_el_evaluado
    productor: >-
      INDOTEL, el regulador nacional, vía la UIT; el Banco Mundial republica.
    nota: >-
      «Individuals using the Internet (% of population)» — la magnitud exacta del indicador.
      NO es `telecom:internet_penetration`, que es banda ancha MÓVIL por 100 habitantes y
      puede pasar de 100; ni las suscripciones del boletín de INDOTEL, congelado en 2022-Q1.
      Se toma del WDI y no de la UIT —que es quien la produce— porque su API dejó de ser
      alcanzable de forma anónima: el host viejo responde 403 en todas sus rutas y el nuevo
      está detrás de un desafío de CloudFront.
      SALVEDAD: la ley fija la línea base en 26,8% para 2009 y la edición vigente del WDI
      dice 27,72%. Es revisión estadística, no desempeño, y va declarada antes de medir
      cualquier distancia a la meta.
      Verificado en prod 2026-08-17: **91,0% en 2024**, contra metas de 60% para 2025 y 70%
      para 2030. Las dos superadas, y la de 2030 con seis años de anticipación. Es el
      segundo indicador del expediente que supera su meta de horizonte completo — y a
      diferencia del primero que lo pareció, éste se mide contra una serie de PAÍS.

  # ══ UNO DE LOS CUATRO DE CARGOS ELECTIVOS ══
  # La ley pide cuatro cuerpos —Senado, Diputados, Síndicas, Regidoras— con la MISMA meta
  # (50% en 2030) y líneas base muy distintas. Solo el de Diputados tiene serie
  # internacional; los otros tres los produce la JCE y quedan declarados como brecha con
  # su destinatario, que es justamente lo que el cliente del informe puede accionar.
  - indicador: "2.44"
    serie: "social_dev:women_lower_house"
    fuente: wdi
    mejor: mayor
    periodo_verificado: "2025"
    estado: verificado
    origen: declarado_por_el_evaluado
    productor: >-
      La propia Cámara de Diputados, reportada a la Unión Interparlamentaria; el Banco
      Mundial republica.
    nota: >-
      «Proportion of seats held by women in national parliaments» del Banco Mundial, sobre
      el reporte de la Unión Interparlamentaria. Para sistemas bicamerales la UIP reporta la
      cámara BAJA, que es exactamente lo que pide el 2.44.
      La identificación no se hizo por el nombre sino por el VALOR: la ley fija la línea
      base de Diputados en 20,8% para 2010 y la serie da 20,77 ese año, mientras la del
      Senado era 9,4%. No hay ambigüedad posible entre las dos, y esa coincidencia es más
      fuerte que cualquier coincidencia de etiqueta.
      Verificado en prod 2026-08-17: **37,4% en 2025**, contra una meta de 41,5% para ese
      mismo año y 50% para 2030. No alcanzada, pero con avance real y sostenido desde el
      20,8% de 2010 — es el contraste con los otros tres cuerpos electivos, que no se miden,
      lo que vuelve accionable este dato.

  # ══ RE-ABIERTO ══ El descarte era correcto para `child_mortality` (menores de 1) y
  # ══ EL CUARTO Y ÚLTIMO CARGO ELECTIVO ══
  - indicador: "2.43"
    serie: "social_dev:women_senate"
    fuente: uip
    mejor: mayor
    periodo_verificado: "2024"
    estado: verificado
    origen: declarado_por_el_evaluado
    productor: >-
      El propio Senado, reportado a la Unión Interparlamentaria (Parline).
    nota: >-
      Composición del Senado (Unión Interparlamentaria, entidad DO-UC01). Es el único de los
      cuatro cargos electivos que ninguna otra fuente cubre: el WDI da la cámara BAJA —20,77
      en 2010, que es Diputados— y la CEPAL solo publica oradores de Cámara Alta, no
      composición.
      La identificación es por VALOR: la ley fija 9,4% para 2010 y la tabla da 9,4% en
      2010-05. `DO-LC01` y `DO-UC01` se parecen demasiado para confiar en la etiqueta.
      Trayectoria: 9,4 (2010) → 12,5 (2020) → 12,5 (2024), contra una meta de 41,5% para
      2025. Tres puntos en catorce años, y sin moverse desde 2020. Es el más rezagado de los
      cuatro.
      SALVEDAD de fuente: Parline ofrece exportación CSV pero está tras un desafío de
      Cloudflare, así que se lee la página pública. Es más frágil y se declara.
      Verificado en prod 2026-08-18: **12,5% en 2024**, contra una meta de 41,5% para 2025.
      Con los cuatro cargos electivos medidos, el 2.43 es el PISO de los cuatro y el único
      que lleva cuatro años sin moverse.

  # ══ DOS DE LOS TRES CARGOS ELECTIVOS QUE FALTABAN ══
  # Los produce la JCE, que no publica API ni dataset abierto —verificado contra
  # datos.gob.do—. La CEPAL los recoge del propio organismo electoral y los publica.
  - indicador: "2.45"
    serie: "social_dev:women_mayors"
    fuente: cepal
    mejor: mayor
    periodo_verificado: "2024"
    estado: verificado
    origen: declarado_por_el_evaluado
    productor: >-
      Junta Central Electoral. La CEPAL recoge y publica; no produce el dato.
    nota: >-
      «Mujeres alcaldesas electas» del Observatorio de Igualdad de Género. La
      identificación es por VALOR y no por nombre —«alcaldesa» es el término regional de lo
      que en RD se llama síndica—: la ley fija 7,7% para 2010 y la serie da EXACTAMENTE 7,7
      ese año.
      La serie es escalonada porque un cargo electivo no cambia hasta la próxima elección.
      Trayectoria: 7,7 (2010) → 13,3 (2016) → 12,0 (2020) → 9,8 (2024), contra una meta de
      41,5% para 2025. Subió, y volvió a bajar.
      Verificado en prod 2026-08-18: **9,8% en 2024**.

  - indicador: "2.46"
    serie: "social_dev:women_councillors"
    fuente: cepal
    mejor: mayor
    periodo_verificado: "2024"
    estado: verificado
    origen: declarado_por_el_evaluado
    productor: >-
      Junta Central Electoral. La CEPAL recoge y publica; no produce el dato.
    nota: >-
      «Mujeres concejalas electas» — regidoras en la terminología dominicana.
      SALVEDAD: la ley fija la línea base en 35,0% para 2010 y la serie da 33,3 ese año,
      1,7 puntos de diferencia. Probablemente sean universos distintos (titulares con o sin
      suplentes); se declara antes de medir cualquier distancia a la meta.
      Con esa salvedad, la lectura es dura: 33,3 (2010) → 30,2 (2020) → 25,8 (2024), contra
