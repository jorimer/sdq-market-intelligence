        fuente: "BCRD, añada vigente conforme al Sexto Manual de Balanza de Pagos"
      - valor: 1896.3
        fuente: "BCRD, añada fechada Mar-25-2014, anterior al Sexto Manual"
      - valor: 1820.2
        fuente: "Banco Mundial, republicando la serie del BCRD"
