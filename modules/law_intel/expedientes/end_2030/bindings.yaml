    serie: "pefa:id_12"
    fuente: pefa
    mejor: mayor
    estado: descartado
    origen: instrumento_de_tercero
    productor: >-
      Evaluadores PEFA: un equipo externo aplica el marco y puntúa contra criterios propios.
      El Estado evaluado no declara su propia calificación.
    motivo_descarte: >-
      Perspectiva plurianual en materia de planificación fiscal (ID-12 del marco PEFA 2011). El marco fue reemplazado en
      febrero de 2016 y los puntajes dejaron de ser comparables con la línea base de 2007 que
      la ley fija y con sus metas.
      El anexo del PEFA RD 2016 —encargado para responder esta pregunta— propone cubrirlo con
      ID-16 (Perspectiva de mediano plazo para la presupuestación del gasto), y para «completar la lógica del anterior indicador» también ID-14 y ID-11, y califica esa equivalencia: «se podría cubrir CON ALGUNAS DEFICIENCIAS» — la más débil de las siete.
      Se DESCARTA para medir la meta de la ley, no porque falte la fuente: la fuente existe y
      publica, pero mide en una escala que no se puede contrastar con la que el legislador
