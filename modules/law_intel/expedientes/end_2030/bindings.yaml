  # ══ BRECHA NUESTRA, CERRADA (PR #748) ══
  # El tema `poverty_extreme` existía en el panel social y no se exponía como señal del Data
  # Registry por no alimentar el índice de desarrollo: la verificación no lo alcanzaba. No era
  # una brecha del Estado ni una duda sobre qué mide — era de superficie, nuestra, y se cerró
  # exponiendo el tema. Verificado en prod el 2026-08-16: 2,0% en 2024.
  - indicador: "2.1"
    serie: "social_dev:poverty_extreme"
    fuente: one
    mejor: menor
    periodo_verificado: "2024"
    estado: propuesto
    nota_comparabilidad: >-
      ⚠️ DEMOTADO 2026-08-16. La variable se mide POR REGIÓN y el registro publica el
      valor de UNA de ellas (la primera del panel, `cibao_norte`), no el del país. El
      indicador de la ley fija una meta NACIONAL, así que el contraste no significaba
      nada — y el número que se publicó era el de una demarcación. No se arregla
      promediando las diez: sin ponderar por población eso tampoco es la cifra del país.
      Vuelve a `verificado` cuando el panel exponga el agregado nacional del tema.
    nota: >-
      2,0% en 2024 contra una meta de 3,5% para 2025 y de 2,0% para 2030: el indicador alcanzó
      la meta del horizonte completo seis años antes. Es el hallazgo más fuerte del expediente
      y por eso mismo el que más exige declarar su salvedad: la línea base legal de 2010
      (10,1%) viene de la ENFT y la medición actual de la ENCFT/ENGIH, con la metodología de
      pobreza monetaria actualizada en 2022 y las metas nunca re-expresadas tras el cambio.
      La magnitud de la mejora no se explica solo por el cambio de metodología, pero atribuirla
      entera a la política sin declarar el corte sería exactamente el defecto que este
      instrumento denuncia.

      La duda que quedaba abierta era si el sync trae filas —la ONE está tras Cloudflare y
      desde fuera no se podía afirmar—. Se respondió contra producción, no a mano:
      `/bindings/verificacion` devolvió `promueve: true` con período 2024.

  # ══════════════════════════════════════════════════════════════════════════════════════
  # LOTE 2026-08-19 — siete indicadores atados de una vez, y qué lo hizo posible
  #
  # Hasta acá cada fuente costaba un ciclo entero: escribir el conector, desplegar,
  # sincronizar, y RECIÉN AHÍ descubrir si la serie medía lo que el indicador dice medir.
  # El error se pagaba al final y completo.
  #
  # La ley trae su propio oráculo y no lo estábamos usando: declara VALOR y AÑO de línea
  # base para 67 de los 77 indicadores sin verificar. Una serie candidata que no reproduce
  # ese valor en ese año no mide lo que el indicador mide. La sonda hace esa comprobación
  # contra la fuente viva en segundos, sin desplegar nada.
  #
  # El barrido de los 67 devolvió: 11 candidatos plausibles, 8 descartados por concepto —el
  # 2.37 pide desocupación AMPLIADA y el emisor da la abierta de la OIT; el 2.48 pide
  # jóvenes DESEMPLEADOS y el emisor da NEET, que incluye inactivos— y 39 sin serie
  # internacional de ningún emisor.
  #
  # ── EL LÍMITE DE LA SONDA, APRENDIDO EN ESTE MISMO LOTE ──
  # De los 11 plausibles, DOS (2.34 saneamiento y 2.35 agua) ya estaban descartados en este
  # expediente, con un argumento que la sonda no puede ver: el JMP cambió su escala en 2015
  # y la cercanía de niveles es JUSTAMENTE lo que haría pasar ese cambio de definición por
  # un dato comparable. La sonda mide coincidencia de NIVEL; el descarte era de DEFINICIÓN.
  # Se respetan los descartes. Si esto se automatizara, habría reintroducido dos bindings
  # que alguien ya había rechazado con razón.
  #
  # Por eso los siete entran como `propuesto`: la sonda comprueba el CONCEPTO contra la
  # línea base, no la plomería. Que producción sirva la serie es otra cosa — el 2.19 lo
  # prueba, su serie existía y el registro publicaba una región.
  # ══════════════════════════════════════════════════════════════════════════════════════

