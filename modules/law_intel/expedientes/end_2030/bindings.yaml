      de sus propios cuadros: sus estadísticas pasaron al Sexto Manual de Balanza de Pagos.
      El veredicto se computó contra esa incertidumbre y la resiste. Aplicando a toda la
      serie el factor de añada más adverso (1.625,3/2.023,7 = 0,8031), las tres metas con
