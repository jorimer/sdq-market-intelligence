  # ══════════════════════════════════════════════════════════════════════════════════════
  # LLECE (2.12 a 2.17) — la ESCALA fue abandonada, no el instrumento
  #
  # Es la trampa inversa a la de PEFA, y por eso vale ponerlas juntas. En PEFA los códigos
  # sobrevivieron y el SIGNIFICADO cambió: `ID-19` pasó de adquisiciones a administración de
  # ingresos. Acá el significado sobrevive intacto —lectura de 6to grado sigue siendo lectura
  # de 6to grado— y lo que cambió es la ESCALA en que se publica.
  #
  # La ley fija sus líneas base y sus metas de puntaje en SERCE 2006, cuya media regional es
  # 500. Desde TERCE 2013 el LLECE publica con media 700. El resultado es que un puntaje
  # moderno leído contra una meta de la ley la supera por unos doscientos puntos:
  #
  #     2.12  Lectura 6º   ERCE 2019 = 643,95   meta 2030 de la ley: «> 557»
  #     2.16  Ciencias 6º  ERCE 2019 = 649,21   meta 2030 de la ley: «> 650»
  #
  # Es decir: atarlo sin más publicaría «meta de 2030 alcanzada en 2019» sobre un país cuyo
  # desempeño real está lejísimos. Es exactamente la forma del defecto que ya nos costó la
  # pobreza extrema de cibao_norte, con otra causa.
  #
  # ── POR QUÉ NO SE PUEDE CONVERTIR ──
  # El equating SERCE↔TERCE existe (bloques de anclaje) pero expresa TERCE EN LA ESCALA DE
  # 500. El de TERCE↔ERCE va en la de 700. No hay puente publicado de ERCE a la escala de la
  # ley, y encadenar los dos por cuenta propia sería inventar la conversión.
  #
  # ── LO QUE SÍ SOBREVIVE: LOS NIVELES ──
  # Está documentado en dos fuentes independientes: los niveles de desempeño de TERCE son
  # «iguales a los de SERCE 2006» por diseño, y ERCE «mantiene sus puntos de corte fijados en
  # el estudio anterior, TERCE». La cadena de niveles se sostiene entera de 2006 a 2019.
  #
  # Por eso un indicador expresado en PORCENTAJE DE ALUMNOS POR NIVEL sobrevive al cambio de
  # escala, y uno expresado en puntaje no. De los seis, solo el 2.17 está escrito así — y es,
  # por casualidad, el único legible.
  #
  # Fuente: tabla oficial del LLECE, legible por máquina, en github.com/llece/comparativo
  # (`tercevserce.csv`, columnas ERCE_nivel_1..4 y TERCE_nivel_1..4; los cuatro niveles suman
  # 1,0000, así que la partición es completa y «en o por debajo del nivel II» es I + II).
  # ══════════════════════════════════════════════════════════════════════════════════════

