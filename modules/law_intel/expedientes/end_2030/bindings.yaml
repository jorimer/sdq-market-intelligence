      región.
      Verificado en prod 2026-08-20: **97,84% en 2019**, contra una meta de 63,0% para 2025 y una línea base legal de 92,9% en 2006. Promovió recién tras declarar `cadencia_anios: 6` — con el umbral anual de tres años, una prueba que se aplica cada seis NUNCA podía estar fresca, y el informe habría dicho «no lo medimos» sobre la medición más reciente que existe.

