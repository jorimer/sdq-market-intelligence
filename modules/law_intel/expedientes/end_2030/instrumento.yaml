# EXPEDIENTE — Estrategia Nacional de Desarrollo 2030 (Ley 1-12)
#
# Un expediente es una ley expresada como DATO. El motor de `law_intel` no conoce ninguna ley
# en particular: evaluar una segunda es agregar una carpeta acá, no tocar `scoring/`. Si
# construir la ley N+1 obliga a editar el motor, el defecto está en el motor.
#
# El registro de indicadores se EXTRAE del articulado (ver `corpus/extractor.py`), nunca del
# informe de avance del propio evaluado ni de un anexo transcrito: la meta que obliga es la
# del texto legal. El informe del órgano rector trabaja con un universo distinto —93
# indicadores frente a los 90 de la ley, amparado en el artículo 20— y esa diferencia es un
# hallazgo del expediente, no un detalle de carga.

id: end-2030
titulo: Estrategia Nacional de Desarrollo 2030
norma: Ley 1-12
promulgada: "2012-01-25"
vigencia_hasta: "2030-12-31"

# Los indicadores viven en cuatro artículos. Fuera de ellos el articulado numera objetivos y
# líneas de acción con la misma forma (`2.1`, `2.1.1.1`): una lectura corrida se los come.
articulos_indicadores: [22, 24, 26, 28]

ejes:
  1: Institucionalidad
  2: Desarrollo social
  3: Desarrollo económico
  4: Sostenibilidad ambiental

# Cuántos indicadores NUMERADOS fija la ley por eje. El cargador lo verifica contra el CSV:
# un registro que no cuadre con lo declarado no se sirve.
indicadores_por_eje: {1: 8, 2: 48, 3: 30, 4: 4}

registro:
  archivo: indicadores.csv
  extraido_por: modules.law_intel.corpus.extractor
  # Metas contrastadas UNA POR UNA contra el texto legal. No es la cobertura del registro:
  # es cuántas filas tienen una segunda lectura humana encima.
  metas_verificadas_a_mano: 21
  nota: >-
    La primera extracción leyó `pdftotext -layout`, que aplana el PDF a una grilla de
    caracteres y descarta los límites de celda. Reconstruirlos a mano produjo doce filas con
    cifras falsas —entre ellas el indicador 3.26 con línea base 4,46 dólares en vez de 4.460,
    porque la coma de miles se leyó como decimal—. La versión vigente lee celdas con
    `pdfplumber`: la columna es un índice, no una distancia.

# La independencia no es una promesa comercial: es una lista blanca que el motor hace cumplir.
# Una fuente fuera de esta lista levanta excepción. Solo fuentes oficiales del propio Estado
# evaluado — es lo único que sostiene que el producto se venda a una parte interesada.
fuentes_admitidas:
  - id: mhe
    nombre: Ministerio de Hacienda y Economía
    del_evaluado: true
    nota: absorbió al MEPyD por la Ley 45-25 (2025-07-23)
  - id: one
    nombre: Oficina Nacional de Estadística
    del_evaluado: true
  - id: bcrd
    nombre: Banco Central de la República Dominicana
    del_evaluado: true
  - id: minerd
    nombre: Ministerio de Educación
    del_evaluado: true
  - id: mem
    nombre: Ministerio de Energía y Minas
    del_evaluado: true
  - id: ces
    nombre: Consejo Económico y Social
    del_evaluado: true
  - id: tc
    nombre: Tribunal Constitucional
    del_evaluado: true
  - id: wdi
    nombre: Indicadores del Desarrollo Mundial (Banco Mundial)
    del_evaluado: false
    nota: >-
      Externa y ADMISIBLE por la misma lógica que la PEFA: no es el órgano evaluado. Que la
      fuente sea de tercero REFUERZA la independencia del informe en vez de debilitarla —
      lo que la lista blanca excluye es que el evaluado se califique a sí mismo, no que el
      dato venga de afuera. Republica series que produce el sistema de Naciones Unidas
      (UIT para conectividad, División de Población para demografía).
      SALVEDAD que viaja con cada binding que la use: las series internacionales se
      REVISAN, y las líneas base de la ley se fijaron sobre una edición concreta. En el
      indicador 3.13 la ley dice 26,8% para 2009 y la edición vigente del WDI dice 27,72%.
      La diferencia es de revisión estadística, no de desempeño, y hay que declararla antes
      de medir la distancia a la meta.
  - id: cepal
    nombre: Observatorio de Igualdad de Género de la CEPAL
    del_evaluado: false
    nota: >-
      Externa y admisible por la misma lógica que la PEFA y el WDI: no es el órgano
      evaluado. Además NO produce el dato sino que lo recoge del organismo electoral de
      cada país — para RD, de la propia JCE. Es la vía abierta a una fuente nacional que no
      publica API ni dataset (verificado contra datos.gob.do).
  - id: uip
    nombre: Unión Interparlamentaria (Parline)
    del_evaluado: false
    nota: >-
      Externa y admisible por la misma lógica que la PEFA, el WDI y la CEPAL: no es el
      órgano evaluado. Publica la composición de cada cámara por separado, que es lo que
      ninguna fuente nacional abierta ofrece para el Senado.
  - id: llece
    nombre: LLECE / UNESCO (SERCE · TERCE · ERCE)
    del_evaluado: false
    nota: >-
      Externa y ADMISIBLE por la misma razón que la PEFA: la propia ley la incorpora — los
      indicadores 2.12 a 2.17 son puntajes y niveles de las pruebas LLECE, con metas fijadas
      en el articulado. Es evidencia interna al instrumento.
      SALVEDAD DE ESCALA, que viaja con cada binding que la use: la ley fija sus líneas base
      y sus metas de PUNTAJE en la escala de SERCE 2006 (media regional 500). Desde TERCE
      2013 el LLECE publica en escala de media 700. El equating SERCE↔TERCE existe pero
      expresa TERCE en la escala de 500; el de TERCE↔ERCE va en la de 700, y NO hay puente
      publicado de ERCE a la escala de la ley. Encadenarlos por cuenta propia sería inventar
      la conversión.
      Los NIVELES de desempeño sí son comparables y está documentado: los de TERCE son
      «iguales a los de SERCE 2006» por diseño, y ERCE mantiene los puntos de corte de TERCE.
      Por eso un indicador expresado en PORCENTAJE de alumnos por nivel sobrevive al cambio
      de escala y uno expresado en puntaje no.
  - id: pefa
    nombre: Evaluación PEFA
    del_evaluado: false
    nota: >-
      Externa pero ADMISIBLE porque la propia ley la incorpora: los indicadores 3.1 a 3.8 son
      puntajes PEFA con metas en letras fijadas en el articulado. Es evidencia interna al
      instrumento, no contraste de tercero.
