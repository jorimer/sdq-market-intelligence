# EXPEDIENTE — Estrategia Nacional de Desarrollo 2030 (Ley 1-12)
#
# Un expediente es una ley expresada como DATO. El motor de `law_intel` no conoce ninguna ley
# en particular: evaluar una segunda es agregar una carpeta acá, no tocar `scoring/`. Si
# construir la ley N+1 obliga a editar el motor, el defecto está en el motor.
#
# El registro de indicadores se EXTRAE del articulado (ver `corpus/extractor.py`), nunca del
# informe de avance del propio evaluado ni de un anexo transcrito: la meta que obliga es la
# del texto legal. El informe del órgano rector trabaja con un universo distinto —93
# indicadores frente a los 90 de la ley, amparado en el artículo 20— y esa diferencia es un
# hallazgo del expediente, no un detalle de carga.

id: end-2030
titulo: Estrategia Nacional de Desarrollo 2030
norma: Ley 1-12
promulgada: "2012-01-25"
vigencia_hasta: "2030-12-31"

# Los indicadores viven en cuatro artículos. Fuera de ellos el articulado numera objetivos y
# líneas de acción con la misma forma (`2.1`, `2.1.1.1`): una lectura corrida se los come.
articulos_indicadores: [22, 24, 26, 28]

ejes:
  1: Institucionalidad
  2: Desarrollo social
  3: Desarrollo económico
  4: Sostenibilidad ambiental

# Cuántos indicadores NUMERADOS fija la ley por eje. El cargador lo verifica contra el CSV:
# un registro que no cuadre con lo declarado no se sirve.
indicadores_por_eje: {1: 8, 2: 48, 3: 30, 4: 4}

registro:
  archivo: indicadores.csv
  extraido_por: modules.law_intel.corpus.extractor
  # Metas contrastadas UNA POR UNA contra el texto legal. No es la cobertura del registro:
  # es cuántas filas tienen una segunda lectura humana encima.
  metas_verificadas_a_mano: 21
  nota: >-
    La primera extracción leyó `pdftotext -layout`, que aplana el PDF a una grilla de
    caracteres y descarta los límites de celda. Reconstruirlos a mano produjo doce filas con
    cifras falsas —entre ellas el indicador 3.26 con línea base 4,46 dólares en vez de 4.460,
    porque la coma de miles se leyó como decimal—. La versión vigente lee celdas con
    `pdfplumber`: la columna es un índice, no una distancia.

# La independencia no es una promesa comercial: es una lista blanca que el motor hace cumplir.
# Una fuente fuera de esta lista levanta excepción. Solo fuentes oficiales del propio Estado
# evaluado — es lo único que sostiene que el producto se venda a una parte interesada.
fuentes_admitidas:
  - id: mhe
    nombre: Ministerio de Hacienda y Economía
    del_evaluado: true
    nota: absorbió al MEPyD por la Ley 45-25 (2025-07-23)
  - id: one
    nombre: Oficina Nacional de Estadística
    del_evaluado: true
  - id: bcrd
    nombre: Banco Central de la República Dominicana
    del_evaluado: true
  - id: minerd
    nombre: Ministerio de Educación
    del_evaluado: true
  - id: mem
    nombre: Ministerio de Energía y Minas
    del_evaluado: true
  - id: ces
    nombre: Consejo Económico y Social
    del_evaluado: true
  - id: tc
    nombre: Tribunal Constitucional
    del_evaluado: true
  - id: wdi
    nombre: Indicadores del Desarrollo Mundial (Banco Mundial)
    del_evaluado: false
    nota: >-
      Externa y ADMISIBLE por la misma lógica que la PEFA: no es el órgano evaluado. Que la
      fuente sea de tercero REFUERZA la independencia del informe en vez de debilitarla —
      lo que la lista blanca excluye es que el evaluado se califique a sí mismo, no que el
      dato venga de afuera. Republica series que produce el sistema de Naciones Unidas
      (UIT para conectividad, División de Población para demografía).
      SALVEDAD que viaja con cada binding que la use: las series internacionales se
      REVISAN, y las líneas base de la ley se fijaron sobre una edición concreta. En el
      indicador 3.13 la ley dice 26,8% para 2009 y la edición vigente del WDI dice 27,72%.
      La diferencia es de revisión estadística, no de desempeño, y hay que declararla antes
      de medir la distancia a la meta.
  - id: cepal
    nombre: Observatorio de Igualdad de Género de la CEPAL
    del_evaluado: false
    nota: >-
      Externa y admisible por la misma lógica que la PEFA y el WDI: no es el órgano
      evaluado. Además NO produce el dato sino que lo recoge del organismo electoral de
      cada país — para RD, de la propia JCE. Es la vía abierta a una fuente nacional que no
      publica API ni dataset (verificado contra datos.gob.do).
    exige_atribucion: true
    atribucion: >-
      Fuente: Junta Central Electoral (JCE) de la República Dominicana, productora del dato;
      recogido y publicado por el Observatorio de Igualdad de Género de la CEPAL.
    nota_de_uso: >-
      LICENCIA REVISADA EL 2026-08-23, en dos pasos, y el segundo corrigió al primero.
      El conector declaraba «uso público con cita». Los términos que el propio servicio
      declara en su OpenAPI conceden bajar y copiar «para su uso personal, sin fines
      comerciales, sin ningún derecho a revender, redistribuir, o crear otros trabajos a
      partir de los mismos». Eso llevó a marcar los indicadores 2.45 y 2.46 como decisión
      pendiente, porque los informes de este eje se venden.
      LO QUE ESA LECTURA OMITÍA: quién PRODUCE el dato. Lo produce la JCE — la nota de
      admisibilidad de esta misma fuente ya lo decía: «NO produce el dato sino que lo recoge
      del organismo electoral de cada país». Los términos de la CEPAL gobiernan SU
      compilación, no los hechos que compila. Una cifra electoral oficial dominicana es
      información pública, y su régimen lo fija el marco nacional —Ley 200-04, Decreto
      103-22 sobre datos abiertos, Ley 65-00 art. 41—, no el portal que la reexpone. Además
      una cifra es un hecho, y los hechos no son obra protegible.
      CONCLUSIÓN: los indicadores 2.45 y 2.46 se publican, atribuyendo a la JCE como
      productora y a la CEPAL como vía. La atribución deja de depender de que el redactor se
      acuerde: `exige_atribucion` la vuelve obligatoria y la computa
      `modules.law_intel.ai_context.atribuciones_obligatorias`.
      LO QUE SIGUE FUERA DE ALCANCE: reexportar la compilación de la CEPAL como tal. Se
      publica la cifra atribuida, no su base.

  - id: uip
    nombre: Unión Interparlamentaria (Parline)
    del_evaluado: false
    nota: >-
      Externa y admisible por la misma lógica que la PEFA, el WDI y la CEPAL: no es el
      órgano evaluado. Publica la composición de cada cámara por separado, que es lo que
      ninguna fuente nacional abierta ofrece para el Senado.
    exige_atribucion: true
    atribucion: >-
      Fuente: Unión Interparlamentaria (Parline), entidad DO-UC01, bajo licencia
      CC BY-NC-SA 4.0.
    nota_de_uso: >-
      LICENCIA CORREGIDA EL 2026-08-22, y la corrección importa para este expediente. El
      conector declaraba «uso público con cita». La licencia real de Parline es
      CC BY-NC-SA 4.0 —Atribución + NoComercial + CompartirIgual—, verificada contra el pie
      de `data.ipu.org` (snapshot de Wayback del 2025-12-07, con el `by-nc-sa.svg` y el
      enlace a la 4.0). La declaración canónica vive en
      `shared.data.ipu_parline_client.LICENSE` y su verificación en
      `shared.data.licenses`; no se copia acá ninguna cifra ni ningún estado.
      LO QUE LA CORRECCIÓN YA RESUELVE: la cláusula BY. La atribución deja de depender de
      que el redactor se acuerde — `exige_atribucion` la vuelve obligatoria para todo
      binding que use esta fuente y `modules.law_intel.ai_context.atribuciones_obligatorias`
      la computa, igual que para el Latinobarómetro.
      LO QUE NO RESUELVE, y está EN CURSO con el emisor: las cláusulas NC y SA. Los informes de
      este eje se entregan en base comercial, y `NC` prohíbe el uso comercial mientras `SA`
      obliga a compartir lo derivado en los mismos términos. Lo que se publica del 2.43 es
      UNA cifra por año tomada de la tabla pública, no la base de Parline; si esa lectura
      alcanza, o si hace falta pedir permiso a la UIP, o si el indicador sale del material
      que se vende, es una decisión que no toma este archivo. Hasta que se tome, la
      cláusula queda escrita donde se lee y no en la memoria de nadie.
      ESTADO AL 2026-08-23: la pregunta ya se le hizo a la UIP por escrito —correo a
      postbox@ipu.org, punto 3 del pedido de acceso, planteando la entrega comercial y
      pidiendo guía sobre si el uso está permitido con atribución—. SIN RESPUESTA todavía.
      La decisión del dueño puede esperar esa respuesta; lo que no puede esperar es que la
      cláusula esté declarada, y lo está.
  - id: llece
    nombre: LLECE / UNESCO (SERCE · TERCE · ERCE)
    del_evaluado: false
    nota: >-
      Externa y ADMISIBLE por la misma razón que la PEFA: la propia ley la incorpora — los
      indicadores 2.12 a 2.17 son puntajes y niveles de las pruebas LLECE, con metas fijadas
      en el articulado. Es evidencia interna al instrumento.
      SALVEDAD DE ESCALA, que viaja con cada binding que la use: la ley fija sus líneas base
      y sus metas de PUNTAJE en la escala de SERCE 2006 (media regional 500). Desde TERCE
      2013 el LLECE publica en escala de media 700. El equating SERCE↔TERCE existe pero
      expresa TERCE en la escala de 500; el de TERCE↔ERCE va en la de 700, y NO hay puente
      publicado de ERCE a la escala de la ley. Encadenarlos por cuenta propia sería inventar
      la conversión.
      Los NIVELES de desempeño sí son comparables y está documentado: los de TERCE son
      «iguales a los de SERCE 2006» por diseño, y ERCE mantiene los puntos de corte de TERCE.
      Por eso un indicador expresado en PORCENTAJE de alumnos por nivel sobrevive al cambio
      de escala y uno expresado en puntaje no.
  - id: encuesta_regional
    nombre: Encuestas regionales de opinión pública
    del_evaluado: false
    nota: >-
      ADMITIDA POR DECISIÓN DEL DUEÑO el 2026-08-22, y conviene registrar por qué hizo falta
      una decisión en vez de aplicar la regla. Las otras fuentes externas entraron por dos
      vías: la ley las incorpora —PEFA, LLECE— o republican dato que produce el sistema
      nacional o el de Naciones Unidas —WDI, CEPAL, UIP—. Una encuesta regional de opinión no
      es ninguna de las dos: produce su propia medición y la ley no la nombra.
      Alcance: los indicadores 1.1 (confianza en los partidos políticos) y 1.4 (índice de
      desarrollo burocrático), que son los dos que la ley fija sobre mediciones de percepción
      y de evaluación experta sin nombrar emisor.
      LO QUE LA DECISIÓN NO CAMBIA: sigue rigiendo el oráculo. Que la fuente sea admisible no
      la vuelve verificada — la serie tiene que reproducir la línea base que el legislador
      escribió, o entrar por uno de los caminos declarados con su salvedad impresa.
      SALVEDAD que viaja con cada binding que la use: una medición de percepción no es una
      medición del fenómeno. «Confianza en los partidos» mide lo que la gente declara sentir,
      y su serie se mueve con el ciclo político y con el diseño del cuestionario. Publicarla
      contra una meta legal sin decir eso convertiría una opinión en un hecho.
    exige_atribucion: true
    atribucion: >-
      Fuente: Latinobarómetro. Cifra computada por SDQ sobre la tabulación que publica el
      emisor.
    nota_de_uso: >-
      DECISIÓN DEL DUEÑO, 2026-08-22. El emisor no declara términos de reutilización en sus
      páginas públicas: ni los permite ni los prohíbe. Lo que se publica no es su microdato ni
      sus tablas sino UNA cifra por año, computada por nosotros sobre la tabulación que su
      propia herramienta muestra a cualquiera sin registrarse. Se resolvió publicar con
      atribución explícita en vez de esperar una respuesta que puede no llegar.
      La atribución NO es una recomendación: `atribucion` es obligatoria para todo binding que
      use esta fuente, y `modules.law_intel.ai_context.atribuciones_obligatorias` la computa
      del expediente para que el informe no dependa de que alguien se acuerde.

  - id: pefa
    nombre: Evaluación PEFA
    del_evaluado: false
    nota: >-
      Externa pero ADMISIBLE porque la propia ley la incorpora: los indicadores 3.1 a 3.8 son
      puntajes PEFA con metas en letras fijadas en el articulado. Es evidencia interna al
      instrumento, no contraste de tercero.
