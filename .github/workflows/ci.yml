name: SDQ Market Intelligence CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─── Backend Tests ───
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          # Del lockfile con hashes: CI corre contra la misma resolución que prod.
          pip install --require-hashes -r requirements.lock
          # Deps solo-de-test (no viajan a la imagen), sin hashes.
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests with coverage
        env:
          DATABASE_URL: "sqlite:///./test.db"
          JWT_SECRET_KEY: "test-secret-key-ci"
          ANTHROPIC_API_KEY: "sk-test-dummy"
          ENVIRONMENT: "test"
        run: |
          pytest modules/ shared/ \
            --cov=modules --cov=shared \
            --cov-report=xml --cov-report=term -v
          # Fail if coverage < 80%
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().attrib['line-rate'])
          print(f'Coverage: {rate*100:.1f}%')
          assert rate >= 0.80, f'Coverage {rate*100:.1f}% < 80%'
          "

      - name: Lint with ruff
        run: |
          # Versión fijada: `pip install ruff` a secas trae la última, y una release nueva
          # (0.16 amplió sus defaults con reglas UP) rompe el gate en código preexistente.
          # El rule set también está fijado en pyproject (select E4/E7/E9/F).
          pip install ruff==0.16.0
          ruff check modules/ shared/ app/

      # mypy con BASELINE (deuda del DD "sin mypy"): los ~1300 errores del código
      # pre-mypy están congelados en mypy-baseline.txt; este paso FALLA solo si un
      # cambio introduce errores de tipos NUEVOS. Para quemar deuda: arreglar y
      # regenerar con `mypy shared/ modules/ app/ | mypy-baseline sync`.
      # (Sin pipefail: el exit que manda es el del filtro, no el de mypy.)
      - name: Type check (mypy + baseline)
        run: |
          pip install "mypy==1.17.1" "mypy-baseline==0.7.4"
          mypy shared/ modules/ app/ 2>&1 | mypy-baseline filter

  # ─── Alembic reversibility ───
  # Un downgrade roto solo se descubre en un rollback de producción bajo presión.
  # Este job prueba, en cada PR, que la última migración es reversible:
  # head → downgrade -1 → head. Barato y atrapa downgrades vacíos/rotos.
  migrations-reversible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Round-trip de la última migración (head → -1 → head)
        env:
          DATABASE_URL: "sqlite:///./_ci_migrations.db"
          JWT_SECRET_KEY: "test-secret-key-ci"
          ANTHROPIC_API_KEY: "sk-test-dummy"
          ENVIRONMENT: "test"
        run: |
          alembic -c infrastructure/alembic.ini upgrade head
          alembic -c infrastructure/alembic.ini downgrade -1
          alembic -c infrastructure/alembic.ini upgrade head

  # ─── Frontend Build ───
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: TypeScript strict check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: ESLint
        run: |
          cd frontend
          npm run lint

      - name: Unit tests (Vitest)
        run: |
          cd frontend
          npm test

  # ─── Docker Build ───
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f infrastructure/Dockerfile -t sdq-market-intelligence:test .

      - name: Smoke test container
        run: |
          docker run -d --name smoke-test \
            -e DATABASE_URL=sqlite:///./test.db \
            -e JWT_SECRET_KEY=test-secret \
            -e ANTHROPIC_API_KEY=sk-test \
            -e ENVIRONMENT=test \
            -p 8000:8000 \
            sdq-market-intelligence:test
          # Reintento con timeout: uvicorn + imports pesados (xgboost) a veces
          # tardan más de 5s en aceptar conexiones; un sleep fijo es frágil.
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/api/v1/health || { docker logs smoke-test; exit 1; }
          docker stop smoke-test

  # El despliegue a producción lo maneja la integración nativa Railway↔GitHub
  # (deploy automático en cada push a main). No se usa un job de deploy en CI.
